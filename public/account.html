<!DOCTYPE html>
<html lang="bn" x-data="accountApp()" x-init="init()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        body {
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .input-field {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .tab-btn {
            padding: 12px 22px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 12px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-color: #6366f1;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
        }

        .action-btn {
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 800;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1.5px solid transparent;
            cursor: pointer;
        }

        .btn-copy { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }
        .btn-copy:hover { background: #e2e8f0; }
        .btn-open { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-delete { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
        .btn-delete:hover { background: #dc2626; color: white; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 10px 28px rgba(99, 102, 241, 0.55);
            transform: translateY(-2px);
        }

        .stat-card {
            border-radius: 16px;
            padding: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 150px; height: 150px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease; }

        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16 gap-2">
                <a href="/" class="flex items-center gap-2.5 flex-shrink-0">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="leading-none hidden sm:block">
                        <span class="text-base font-black text-gray-900 block">FreeHost<span class="text-indigo-600"> BD</span></span>
                        <span class="text-[9px] text-gray-400 font-bold tracking-wider">MY ACCOUNT</span>
                    </div>
                </a>
                <div class="flex items-center gap-2 flex-wrap justify-end">
                    <a href="/" class="bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-50 transition">
                        <i class="fa-solid fa-house"></i> <span class="hidden sm:inline">হোস্টিং</span>
                    </a>
                    <a href="/shop" class="bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-50 transition">
                        <i class="fa-solid fa-store"></i> <span class="hidden sm:inline">শপ</span>
                    </a>
                    <template x-if="user">
                        <button @click="logout()" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </template>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">

        <!-- NOT LOGGED IN -->
        <template x-if="!user">
            <div class="max-w-md mx-auto fade-in">
                <div class="glass-card p-8">
                    <div class="text-center mb-6">
                        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-xl mb-4">
                            <i class="fa-solid fa-user-astronaut text-white text-2xl"></i>
                        </div>
                        <h1 class="text-2xl font-black text-gray-900 mb-1" x-text="mode === 'login' ? 'লগইন করুন' : 'নতুন একাউন্ট'"></h1>
                        <p class="text-xs text-gray-500" x-text="mode === 'login' ? 'আপনার একাউন্টে প্রবেশ করুন' : 'ফ্রি একাউন্ট খুলুন'"></p>
                    </div>

                    <div class="space-y-4">
                        <template x-if="mode === 'register'">
                            <div>
                                <label class="text-xs font-bold text-gray-700 mb-1.5 block">আপনার নাম</label>
                                <input type="text" x-model="form.name" placeholder="e.g. Rakib Hasan" class="input-field">
                            </div>
                        </template>

                        <div>
                            <label class="text-xs font-bold text-gray-700 mb-1.5 block">মোবাইল নাম্বার</label>
                            <input type="text" x-model="form.phone" placeholder="01XXXXXXXXX" class="input-field">
                        </div>

                        <div>
                            <label class="text-xs font-bold text-gray-700 mb-1.5 block">পাসওয়ার্ড</label>
                            <div class="relative">
                                <input :type="showPass ? 'text' : 'password'" x-model="form.password" placeholder="••••••••" class="input-field pr-12">
                                <button @click="showPass = !showPass" type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                                    <i :class="showPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" class="text-sm"></i>
                                </button>
                            </div>
                        </div>

                        <button @click="submit()" :disabled="loading" class="btn-submit">
                            <span x-show="!loading" class="flex items-center gap-2">
                                <i class="fa-solid" :class="mode === 'login' ? 'fa-right-to-bracket' : 'fa-user-plus'"></i>
                                <span x-text="mode === 'login' ? 'লগইন করুন' : 'রেজিস্টার করুন'"></span>
                            </span>
                            <span x-show="loading" class="flex items-center gap-2">
                                <i class="fa-solid fa-circle-notch fa-spin"></i>
                                <span>অপেক্ষা করুন...</span>
                            </span>
                        </button>

                        <div class="pt-2">
                            <button @click="mode = mode === 'login' ? 'register' : 'login'; error = ''" class="w-full bg-indigo-50 text-indigo-700 border-2 border-indigo-200 py-3 rounded-xl text-xs font-bold hover:bg-indigo-100 transition">
                                <span x-text="mode === 'login' ? 'নতুন একাউন্ট খুলুন →' : '← আগের একাউন্টে লগইন'"></span>
                            </button>
                        </div>

                        <template x-if="error">
                            <div class="bg-red-50 border border-red-200 rounded-xl p-3 text-center">
                                <p class="text-xs font-bold text-red-600" x-text="error"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- LOGGED IN -->
        <template x-if="user">
            <div class="fade-in space-y-6">
                
                <!-- PROFILE HEADER -->
                <div class="glass-card p-6">
                    <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
                        <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-3xl font-black text-white shadow-lg flex-shrink-0">
                            <span x-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'"></span>
                        </div>
                        <div class="flex-1 text-center sm:text-left">
                            <h1 class="text-2xl font-black text-gray-900" x-text="user.name"></h1>
                            <p class="text-sm mono text-gray-500 mt-1"><i class="fa-solid fa-phone text-xs mr-1"></i><span x-text="user.phone"></span></p>
                            <div class="flex items-center justify-center sm:justify-start gap-2 mt-3">
                                <span class="badge bg-emerald-50 text-emerald-600"><i class="fa-solid fa-circle text-[6px] mr-1"></i> ACTIVE</span>
                                <span class="text-[10px] mono text-gray-400"><i class="fa-solid fa-calendar text-xs mr-1"></i> <span x-text="new Date(user.createdAt).toLocaleDateString('en-GB')"></span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- STATS -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <div class="flex items-center justify-between mb-2 relative z-10">
                            <span class="text-[10px] font-bold tracking-wider opacity-90">ব্যালেন্স</span>
                            <i class="fa-solid fa-wallet text-lg opacity-80"></i>
                        </div>
                        <div class="text-3xl font-black relative z-10">৳ <span x-text="user.balance || 0"></span></div>
                        <button @click="showDeposit = true" class="mt-2 bg-white/25 text-white border border-white/50 backdrop-blur px-3 py-1.5 rounded-lg text-[11px] font-bold relative z-10">
                            <i class="fa-solid fa-plus mr-1"></i> ডিপোজিট
                        </button>
                    </div>
                    <div class="stat-card" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">
                        <div class="flex items-center justify-between mb-2 relative z-10">
                            <span class="text-[10px] font-bold tracking-wider opacity-90">হোস্ট</span>
                            <i class="fa-solid fa-cloud text-lg opacity-80"></i>
                        </div>
                        <div class="text-3xl font-black relative z-10" x-text="hosts.length"></div>
                        <a href="/" class="mt-2 bg-white/25 text-white border border-white/50 backdrop-blur px-3 py-1.5 rounded-lg text-[11px] font-bold inline-block relative z-10">
                            <i class="fa-solid fa-plus mr-1"></i> নতুন
                        </a>
                    </div>
                </div>

                <!-- TABS -->
                <div class="flex gap-2 overflow-x-auto pb-1">
                    <button @click="tab = 'hosts'" :class="tab === 'hosts' ? 'active' : ''" class="tab-btn">
                        <i class="fa-solid fa-cloud"></i> হোস্ট
                    </button>
                    <button @click="tab = 'deposits'" :class="tab === 'deposits' ? 'active' : ''" class="tab-btn">
                        <i class="fa-solid fa-money-bill-transfer"></i> ডিপোজিট
                    </button>
                    <button @click="tab = 'orders'" :class="tab === 'orders' ? 'active' : ''" class="tab-btn">
                        <i class="fa-solid fa-bag-shopping"></i> অর্ডার
                    </button>
                </div>

                <!-- HOSTS TAB -->
                <template x-if="tab === 'hosts'">
                    <div class="space-y-3">
                        <template x-if="hosts.length === 0">
                            <div class="glass-card p-10 text-center">
                                <i class="fa-solid fa-cloud text-4xl text-gray-300 mb-3 block"></i>
                                <p class="text-sm text-gray-500 mb-4">এখনো কোনো হোস্ট নেই</p>
                                <a href="/" class="inline-block bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold">হোস্ট করুন</a>
                            </div>
                        </template>
                        <template x-for="h in hosts" :key="h._id">
                            <div class="glass-card p-4">
                                <div class="flex items-start gap-3">
                                    <div class="w-11 h-11 rounded-xl bg-cyan-50 border border-cyan-100 flex items-center justify-center flex-shrink-0">
                                        <i class="fa-brands fa-html5 text-cyan-600"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-gray-900 truncate" x-text="h.title"></p>
                                        <p class="text-[11px] mono text-indigo-600 truncate mt-0.5" x-text="window.location.origin + '/s/' + h.slug"></p>
                                        <div class="flex items-center gap-3 mt-1.5 text-[10px] text-gray-400">
                                            <span><i class="fa-solid fa-eye mr-1"></i><span x-text="h.views || 0"></span></span>
                                            <template x-if="h.password"><span class="text-amber-600 font-bold"><i class="fa-solid fa-lock mr-1"></i> Locked</span></template>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-2 mt-3">
                                    <button @click="copyLink(window.location.origin + '/s/' + h.slug)" class="action-btn btn-copy flex-1">
                                        <i class="fa-regular fa-copy"></i> কপি
                                    </button>
                                    <a :href="'/s/' + h.slug" target="_blank" class="action-btn btn-open flex-1">
                                        <i class="fa-solid fa-external-link-alt"></i> ওপেন
                                    </a>
                                    <button @click="deleteHost(h._id)" class="action-btn btn-delete">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- DEPOSITS TAB -->
                <template x-if="tab === 'deposits'">
                    <div class="space-y-3">
                        <template x-if="deposits.length === 0">
                            <div class="glass-card p-10 text-center">
                                <i class="fa-solid fa-money-bill-transfer text-4xl text-gray-300 mb-3 block"></i>
                                <p class="text-sm text-gray-500 mb-4">এখনো কোনো ডিপোজিট নেই</p>
                                <button @click="showDeposit = true" class="inline-block bg-emerald-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold">ডিপোজিট করুন</button>
                            </div>
                        </template>
                        <template x-for="d in deposits" :key="d._id">
                            <div class="glass-card p-4 flex items-center gap-3">
                                <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
                                     :class="d.status === 'approved' ? 'bg-emerald-50 text-emerald-600' : d.status === 'rejected' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600'">
                                    <i class="fa-solid text-sm" :class="d.status === 'approved' ? 'fa-check' : d.status === 'rejected' ? 'fa-xmark' : 'fa-clock'"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-black text-gray-900">৳ <span x-text="d.amount"></span></p>
                                    <p class="text-[10px] mono text-gray-500 truncate" x-text="d.method + ' • ' + d.transactionId"></p>
                                    <p class="text-[10px] text-gray-400" x-text="new Date(d.createdAt).toLocaleDateString('en-GB')"></p>
                                </div>
                                <span class="badge" :class="d.status === 'approved' ? 'bg-emerald-50 text-emerald-600' : d.status === 'rejected' ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600'" x-text="d.status"></span>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ORDERS TAB -->
                <template x-if="tab === 'orders'">
                    <div class="space-y-3">
                        <template x-if="orders.length === 0">
                            <div class="glass-card p-10 text-center">
                                <i class="fa-solid fa-bag-shopping text-4xl text-gray-300 mb-3 block"></i>
                                <p class="text-sm text-gray-500 mb-4">এখনো কোনো অর্ডার নেই</p>
                                <a href="/shop" class="inline-block bg-orange-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold">শপে যান</a>
                            </div>
                        </template>
                        <template x-for="o in orders" :key="o._id">
                            <div class="glass-card p-4">
                                <div class="flex items-center gap-3 mb-2">
                                    <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center flex-shrink-0">
                                        <i class="fa-solid fa-code text-orange-600 text-xs"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-gray-900 truncate" x-text="o.productName"></p>
                                        <p class="text-[10px] mono text-gray-500">৳<span x-text="o.price"></span> • <span x-text="new Date(o.createdAt).toLocaleDateString('en-GB')"></span></p>
                                    </div>
                                </div>
                                <button @click="viewOrderDetails(o._id)" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-[10px] font-bold transition">
                                    <i class="fa-solid fa-eye mr-1"></i> বিস্তারিত দেখুন
                                </button>
                            </div>
                        </template>
                    </div>
                </template>

            </div>
        </template>

    </main>

    <!-- DEPOSIT MODAL -->
    <div x-show="showDeposit" x-cloak @click.self="showDeposit = false" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(15,23,42,0.7); backdrop-filter: blur(8px);">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 fade-in">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-xl font-black text-gray-900">💰 ডিপোজিট</h2>
                <button @click="showDeposit = false" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4">
                <p class="text-[11px] font-bold text-emerald-700 mb-1">💚 বিকাশ নাম্বার:</p>
                <p class="text-lg font-black text-emerald-900 mono" x-text="settings.bkashNumber"></p>
                <p class="text-[10px] text-emerald-600 mt-1">টাকা পাঠিয়ে নিচের ফর্ম পূরণ করুন</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-gray-600 mb-1 block">পরিমাণ (৳৫০-২৫০০)</label>
                    <input type="number" x-model="depositForm.amount" class="input-field" placeholder="৫০ - ২৫০০">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-600 mb-1 block">আপনার নাম্বার</label>
                    <input type="text" x-model="depositForm.senderNumber" class="input-field" placeholder="01XXXXXXXXX">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-600 mb-1 block">ট্রানজেকশন আইডি</label>
                    <input type="text" x-model="depositForm.transactionId" class="input-field mono" placeholder="TrxID">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-gray-600 mb-1 block">মেথড</label>
                    <select x-model="depositForm.method" class="input-field">
                        <option value="bKash">বিকাশ</option>
                        <option value="Nagad">নগদ</option>
                    </select>
                </div>
                <button @click="submitDeposit()" :disabled="depositing" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-3.5 rounded-xl font-black text-sm shadow-lg disabled:opacity-50 transition">
                    <span x-show="!depositing">🚀 রিকোয়েস্ট পাঠান</span>
                    <span x-show="depositing">⏳ পাঠানো হচ্ছে...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ORDER DETAILS MODAL -->
    <div x-show="showOrderDetails" x-cloak @click.self="showOrderDetails = false" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(15,23,42,0.7); backdrop-filter: blur(8px);">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 fade-in max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-black text-gray-900">অর্ডার বিস্তারিত</h2>
                <button @click="showOrderDetails = false" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            
            <template x-if="orderDetails">
                <div class="space-y-3">
                    <div class="bg-orange-50 rounded-xl p-4">
                        <p class="text-[10px] font-bold text-orange-600 mb-1">প্রোডাক্ট</p>
                        <p class="text-sm font-black text-gray-900" x-text="orderDetails.name"></p>
                    </div>
                    
                    <template x-if="orderDetails.mainLink">
                        <div>
                            <p class="text-[10px] font-bold text-gray-600 mb-1">🔗 মেইন লিংক</p>
                            <div class="bg-gray-50 rounded-xl p-3 mono text-[11px] text-indigo-600 break-all" x-text="orderDetails.mainLink"></div>
                        </div>
                    </template>
                    
                    <template x-if="orderDetails.mainPassword">
                        <div>
                            <p class="text-[10px] font-bold text-gray-600 mb-1">🔑 পাসওয়ার্ড</p>
                            <div class="bg-gray-50 rounded-xl p-3 mono text-[11px] text-amber-600" x-text="orderDetails.mainPassword"></div>
                        </div>
                    </template>
                    
                    <template x-if="orderDetails.mainCode">
                        <div>
                            <p class="text-[10px] font-bold text-gray-600 mb-1">💻 কোড</p>
                            <div class="bg-gray-900 text-green-400 rounded-xl p-3 mono text-[10px] max-h-40 overflow-y-auto whitespace-pre-wrap" x-text="orderDetails.mainCode"></div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <!-- TOAST -->
    <div x-show="showToast" x-cloak class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 max-w-sm">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" :class="toastType === 'error' ? 'bg-red-500' : 'bg-emerald-500'">
            <i class="fa-solid text-sm" :class="toastType === 'error' ? 'fa-xmark' : 'fa-check'"></i>
        </div>
        <div class="min-w-0">
            <p class="text-xs font-bold" x-text="toastMessage"></p>
            <p class="text-[10px] text-gray-400 truncate" x-text="toastSubtext"></p>
        </div>
    </div>

    <script>
        function accountApp() {
            return {
                user: null,
                mode: 'login',
                form: { name: '', phone: '', password: '' },
                showPass: false,
                loading: false,
                error: '',
                tab: 'hosts',
                hosts: [],
                deposits: [],
                orders: [],
                showDeposit: false,
                depositing: false,
                depositForm: { amount: '', senderNumber: '', transactionId: '', method: 'bKash' },
                showOrderDetails: false,
                orderDetails: null,
                showToast: false,
                toastMessage: '',
                toastSubtext: '',
                toastType: 'success',
                settings: { bkashNumber: '01XXXXXXXXX', nagadNumber: '01XXXXXXXXX' },

                init() {
                    const stored = localStorage.getItem('user');
                    const token = localStorage.getItem('token');
                    if (stored && token) {
                        try {
                            this.user = JSON.parse(stored);
                            this.loadData();
                        } catch(e) {}
                    }
                    this.loadPublicSettings();
                },

                async loadPublicSettings() {
                    try {
                        const res = await fetch('/api/setting/public');
                        const data = await res.json();
                        if (data.bkashNumber) this.settings.bkashNumber = data.bkashNumber;
                        if (data.nagadNumber) this.settings.nagadNumber = data.nagadNumber;
                    } catch(e) {}
                },

                async submit() {
                    this.error = '';
                    if (this.mode === 'register' && !this.form.name.trim()) return this.error = 'নাম দিন';
                    if (!this.form.phone.trim()) return this.error = 'মোবাইল নাম্বার দিন';
                    if (!this.form.password || this.form.password.length < 4) return this.error = 'পাসওয়ার্ড কমপক্ষে ৪ অক্ষর';

                    this.loading = true;
                    try {
                        const url = this.mode === 'login' ? '/api/auth/login' : '/api/auth/register';
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.form)
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'ব্যর্থ');

                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        this.user = data.user;
                        this.showToastMsg('সফল! 🎉', this.mode === 'login' ? 'লগইন হয়েছে' : 'একাউন্ট তৈরি হয়েছে');
                        this.loadData();
                    } catch (err) {
                        this.error = err.message;
                    } finally {
                        this.loading = false;
                    }
                },

                logout() {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    this.user = null;
                    this.hosts = []; this.deposits = []; this.orders = [];
                },

                async loadData() {
                    const token = localStorage.getItem('token');
                    if (!token) return;
                    try {
                        const [h, d, o] = await Promise.all([
                            fetch('/api/host/my', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()).catch(() => []),
                            fetch('/api/shop/deposits/my', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()).catch(() => []),
                            fetch('/api/shop/orders/my', { headers: { 'Authorization': 'Bearer ' + token } }).then(r => r.json()).catch(() => [])
                        ]);
                        this.hosts = Array.isArray(h) ? h : [];
                        this.deposits = Array.isArray(d) ? d : [];
                        this.orders = Array.isArray(o) ? o : [];
                    } catch(e) { console.error(e); }
                },

                async submitDeposit() {
                    if (!this.depositForm.amount || !this.depositForm.senderNumber || !this.depositForm.transactionId) {
                        return this.showToastMsg('তথ্য অসম্পূর্ণ', 'সব ফিল্ড পূরণ করুন', 'error');
                    }
                    const amt = Number(this.depositForm.amount);
                    if (amt < 50 || amt > 2500) {
                        return this.showToastMsg('ভুল পরিমাণ', '৫০ থেকে ২৫০০ টাকা', 'error');
                    }
                    this.depositing = true;
                    try {
                        const token = localStorage.getItem('token');
                        const res = await fetch('/api/shop/deposit', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify(this.depositForm)
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'ব্যর্থ');
                        this.showToastMsg('পাঠানো হয়েছে! ⏳', 'অ্যাডমিন approve করলে যোগ হবে');
                        this.depositForm = { amount: '', senderNumber: '', transactionId: '', method: 'bKash' };
                        this.showDeposit = false;
                        this.loadData();
                    } catch (err) {
                        this.showToastMsg('ব্যর্থ', err.message, 'error');
                    } finally {
                        this.depositing = false;
                    }
                },

                async deleteHost(id) {
                    if (!confirm('এই হোস্ট ডিলিট করবেন?')) return;
                    try {
                        const token = localStorage.getItem('token');
                        const res = await fetch('/api/host/' + id, {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        if (res.ok) {
                            this.hosts = this.hosts.filter(h => h._id !== id);
                            this.showToastMsg('ডিলিট হয়েছে', '');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async viewOrderDetails(orderId) {
                    try {
                        const token = localStorage.getItem('token');
                        const res = await fetch('/api/shop/orders/' + orderId, {
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        const data = await res.json();
                        if (data.product) {
                            this.orderDetails = data.product;
                            this.showOrderDetails = true;
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                copyLink(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToastMsg('কপি হয়েছে', text);
                    }).catch(() => {
                        this.showToastMsg('ব্যর্থ', 'ম্যানুয়ালি কপি করুন', 'error');
                    });
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg;
                    this.toastSubtext = sub;
                    this.toastType = type;
                    this.showToast = true;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
