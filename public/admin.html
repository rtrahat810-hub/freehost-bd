<!DOCTYPE html>
<html lang="bn" x-data="adminApp()" x-init="init()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        body { background: #030712; color: #f3f4f6; min-height: 100vh; }
        .glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.7); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-ghost { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.25s ease; }
        .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); }
        .premium-input { background: rgba(15, 23, 42, 0.8); border: 1.5px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: #fff; outline: none; transition: all 0.3s ease; }
        .premium-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
        .premium-input::placeholder { color: rgba(148, 163, 184, 0.5); }
        .stat-card { transition: all 0.35s ease; position: relative; overflow: hidden; }
        .stat-card:hover { transform: translateY(-4px); border-color: rgba(139, 92, 246, 0.3); }
        .badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.35s ease; }
        .empty-state { padding: 60px 20px; text-align: center; }
        .empty-state i { font-size: 48px; color: rgba(148, 163, 184, 0.2); margin-bottom: 16px; }
        .tab-btn { padding: 8px 16px; border-radius: 10px; font-size: 11px; font-weight: 800; transition: all 0.25s; border: 1px solid transparent; }
        .tab-btn.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .tab-btn:not(.active) { background: rgba(255,255,255,0.03); color: rgba(148, 163, 184, 0.8); border-color: rgba(255,255,255,0.06); }
        .sidebar-bg { background: linear-gradient(180deg, #0a0e1a 0%, #050811 100%); border-right: 1px solid rgba(255, 255, 255, 0.06); }
        .menu-item { transition: all 0.25s ease; border-radius: 10px; position: relative; overflow: hidden; }
        .menu-item:hover { background: rgba(99, 102, 241, 0.08); color: #fff; }
        .menu-item.active { background: linear-gradient(90deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.08)); color: #fff; box-shadow: inset 3px 0 0 #818cf8; }
        .group-label { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(148, 163, 184, 0.5); padding: 12px 12px 6px; }
        .checkbox { width: 18px; height: 18px; border-radius: 5px; border: 2px solid rgba(255,255,255,0.15); background: transparent; cursor: pointer; transition: all 0.2s; accent-color: #6366f1; }
        .checkbox:checked { background: #6366f1; border-color: #6366f1; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <template x-if="!loggedIn">
        <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
            <div class="glass rounded-3xl p-8 max-w-md w-full relative z-10">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-600 to-cyan-400 flex items-center justify-center shadow-2xl mb-5">
                        <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-black text-white mb-1">Admin Panel</h1>
                    <p class="text-[10px] text-indigo-300 mono tracking-widest">FREEHOST BD</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-300 mb-2 block">পাসওয়ার্ড</label>
                        <div class="relative">
                            <input :type="showPass ? 'text' : 'password'" x-model="password" @keyup.enter="login()" placeholder="Enter admin password" class="premium-input w-full px-4 py-3.5 text-sm pr-12">
                            <button @click="showPass = !showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                                <i :class="showPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" class="text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <button @click="login()" class="btn-primary w-full py-4 rounded-2xl font-black text-sm text-white">
                        <i class="fa-solid fa-unlock mr-2"></i> লগইন
                    </button>
                    <template x-if="loginError">
                        <div class="bg-red-500/20 border border-red-500/30 rounded-2xl p-3 text-center">
                            <p class="text-xs font-bold text-red-300" x-text="loginError"></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template x-if="loggedIn">
        <div class="flex min-h-screen relative">
            <div x-show="mobileMenu" x-cloak @click="mobileMenu = false" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 lg:hidden"></div>

            <!-- SIDEBAR -->
            <aside :class="mobileMenu ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" class="fixed lg:sticky top-0 left-0 w-64 h-screen sidebar-bg z-50 lg:z-10 flex flex-col transition-transform duration-300 overflow-hidden">
                <div class="flex items-center gap-3 px-4 py-4 border-b border-white/5 flex-shrink-0">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-600 to-cyan-400 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-shield-halved text-white text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-black text-white truncate">FreeHost BD</div>
                        <div class="text-[9px] mono text-indigo-300 tracking-wider">ADMIN v2.0</div>
                    </div>
                    <button @click="mobileMenu = false" class="lg:hidden w-8 h-8 rounded-lg btn-ghost flex items-center justify-center">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <nav class="flex-1 overflow-y-auto px-2 py-3">
                    <template x-for="group in menuGroups" :key="group.label">
                        <div class="mb-2">
                            <div class="group-label" x-text="group.label"></div>
                            <template x-for="item in group.items" :key="item.id">
                                <button @click="section = item.id; mobileMenu = false" :class="section === item.id ? 'active' : 'text-gray-400'" class="menu-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3 mb-0.5">
                                    <i :class="'fa-solid ' + item.icon" class="w-4 text-sm"></i>
                                    <span class="flex-1" x-text="item.label"></span>
                                    <template x-if="item.badge && item.badge() > 0">
                                        <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-red-500 text-white" x-text="item.badge()"></span>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </template>
                </nav>

                <div class="p-3 border-t border-white/5 flex-shrink-0">
                    <button @click="logout()" class="w-full text-xs font-bold text-red-400 hover:text-red-300 px-3 py-2.5 rounded-xl hover:bg-red-500/10 flex items-center gap-3 transition">
                        <i class="fa-solid fa-right-from-bracket w-4"></i> লগআউট
                    </button>
                </div>
            </aside>

            <!-- MAIN AREA -->
            <main class="flex-1 min-w-0 flex flex-col">
                <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 lg:px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <button @click="mobileMenu = true" class="lg:hidden w-10 h-10 rounded-xl btn-ghost flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-bars text-sm"></i>
                        </button>
                        <div class="min-w-0">
                            <h1 class="text-sm lg:text-base font-black text-white truncate" x-text="sectionTitle"></h1>
                            <p class="text-[10px] mono text-gray-500 truncate">Admin / <span x-text="sectionTitle"></span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- Notifications Bell -->
                        <button @click="section = 'notifications'" class="relative w-9 h-9 rounded-xl btn-ghost flex items-center justify-center">
                            <i class="fa-solid fa-bell text-xs text-amber-400"></i>
                            <template x-if="unreadNotifs > 0">
                                <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center" x-text="unreadNotifs"></span>
                            </template>
                        </button>
                        <button @click="refreshData()" class="w-9 h-9 rounded-xl btn-ghost flex items-center justify-center">
                            <i class="fa-solid fa-rotate text-xs" :class="loading ? 'fa-spin' : ''"></i>
                        </button>
                    </div>
                </header>

                <div class="flex-1 p-4 lg:p-6 overflow-x-hidden">

                    <!-- ============ DASHBOARD ============ -->
                    <template x-if="section === 'dashboard'">
                        <div class="fade-in space-y-5">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-cyan-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-cloud text-cyan-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-cyan-300" x-text="hosts.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">মোট হোস্ট</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-red-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-ban text-red-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-red-300" x-text="bannedHosts.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">ব্যান করা</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-indigo-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-eye text-indigo-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-indigo-300" x-text="totalViews"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">মোট ভিউ</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-emerald-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-circle text-emerald-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-emerald-300" x-text="onlineNow"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">এখন অনলাইন</div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ============ ALL HOSTS ============ -->
                    <template x-if="section === 'hosts'">
                        <div class="fade-in space-y-3">
                            <!-- Search & Filter -->
                            <div class="flex flex-wrap gap-2">
                                <input type="text" x-model="hostSearch" placeholder="🔍 নাম বা স্লাগ সার্চ..." class="premium-input flex-1 min-w-[200px] px-4 py-3 text-sm">
                                <select x-model="statusFilter" class="premium-input px-4 py-3 text-sm">
                                    <option value="all">সব</option>
                                    <option value="active">শুধু Active</option>
                                    <option value="banned">শুধু Banned</option>
                                    <option value="password">পাসওয়ার্ড আছে</option>
                                </select>
                            </div>

                            <!-- Bulk Action Bar -->
                            <template x-if="selectedHosts.length > 0">
                                <div class="glass rounded-2xl p-3 flex items-center gap-2 flex-wrap border-indigo-500/40">
                                    <span class="text-xs font-bold text-indigo-300"><span x-text="selectedHosts.length"></span> টি সিলেক্ট</span>
                                    <div class="flex-1"></div>
                                    <button @click="bulkAction('ban')" class="btn-warning px-3 py-2 rounded-lg text-[10px] font-black text-white">BAN</button>
                                    <button @click="bulkAction('unban')" class="btn-success px-3 py-2 rounded-lg text-[10px] font-black text-white">UNBAN</button>
                                    <button @click="bulkAction('delete')" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-trash"></i> DELETE</button>
                                </div>
                            </template>

                            <template x-if="filteredHosts.length === 0">
                                <div class="glass rounded-2xl empty-state">
                                    <i class="fa-solid fa-cloud"></i>
                                    <p class="text-sm text-gray-400">কোনো হোস্ট নেই</p>
                                </div>
                            </template>

                            <div class="space-y-2">
                                <template x-for="h in filteredHosts" :key="h._id">
                                    <div class="glass rounded-2xl p-4">
                                        <div class="flex items-start gap-3">
                                            <input type="checkbox" class="checkbox mt-2" :checked="selectedHosts.includes(h._id)" @change="toggleSelect(h._id)">
                                            <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center flex-shrink-0"><i class="fa-brands fa-html5 text-cyan-400"></i></div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <p class="text-sm font-bold text-white truncate" x-text="h.title"></p>
                                                    <span x-show="h.banned" class="badge bg-red-500/20 text-red-300">BANNED</span>
                                                    <span x-show="isOnline(h)" class="badge bg-emerald-500/20 text-emerald-300">● ONLINE</span>
                                                </div>
                                                <p class="text-[10px] mono text-indigo-300 truncate mt-0.5" x-text="'/p/' + h.slug"></p>
                                                <p class="text-[10px] text-gray-500 mono mt-1">👁 <span x-text="h.views || 0"></span> views</p>
                                            </div>
                                        </div>

                                        <div x-show="h.password" class="mt-2 flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 rounded-lg px-3 py-2">
                                            <i class="fa-solid fa-lock text-amber-400 text-xs"></i>
                                            <span class="text-[10px] text-amber-300 font-bold">পাসওয়ার্ড:</span>
                                            <template x-if="editingPasswordId !== h._id">
                                                <div class="flex items-center gap-2 flex-1">
                                                    <span class="text-[11px] mono text-amber-200 flex-1" x-text="h.password"></span>
                                                    <button @click="startEditPassword(h._id, h.password)" class="text-[9px] font-black text-indigo-400 px-2 py-1 rounded bg-indigo-500/10 border border-indigo-500/20">
                                                        <i class="fa-solid fa-pen"></i> এডিট
                                                    </button>
                                                </div>
                                            </template>
                                            <template x-if="editingPasswordId === h._id">
                                                <div class="flex items-center gap-2 flex-1">
                                                    <input type="text" x-model="newPasswordValue" class="flex-1 bg-black/40 border border-white/20 rounded px-2 py-1 text-[11px] mono text-white">
                                                    <button @click="savePassword(h._id)" class="text-[9px] font-black text-emerald-400 px-2 py-1 rounded bg-emerald-500/10 border border-emerald-500/20">
                                                        <i class="fa-solid fa-check"></i>
                                                    </button>
                                                    <button @click="cancelEditPassword()" class="text-[9px] font-black text-red-400 px-2 py-1 rounded bg-red-500/10 border border-red-500/20">
                                                        <i class="fa-solid fa-xmark"></i>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>

                                        <div class="flex gap-1.5 mt-3 flex-wrap">
                                            <button @click="viewCode(h)" class="btn-primary px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-code"></i> কোড</button>
                                            <a :href="'/p/' + h.slug" target="_blank" class="btn-ghost px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-external-link"></i></a>
                                            <button @click="downloadCode(h)" class="btn-ghost px-3 py-2 rounded-lg text-[10px] font-black text-white" title="Download"><i class="fa-solid fa-download"></i></button>
                                            <button @click="showQR(h)" class="btn-ghost px-3 py-2 rounded-lg text-[10px] font-black text-white" title="QR Code"><i class="fa-solid fa-qrcode text-cyan-400"></i></button>
                                            <button @click="openRedirectModal(h)" class="btn-ghost px-3 py-2 rounded-lg text-[10px] font-black text-white" title="Redirect"><i class="fa-solid fa-arrow-right-arrow-left text-orange-400"></i></button>
                                            <button @click="toggleHostBan(h)" :class="h.banned ? 'btn-success' : 'btn-warning'" class="px-3 py-2 rounded-lg text-[10px] font-black text-white"><span x-text="h.banned ? 'UNBAN' : 'BAN'"></span></button>
                                            <button @click="deleteHost(h._id)" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- ============ BANNED HOSTS ============ -->
                    <template x-if="section === 'banned-hosts'">
                        <div class="fade-in space-y-2">
                            <template x-if="bannedHosts.length === 0">
                                <div class="glass rounded-2xl empty-state"><i class="fa-solid fa-shield-halved"></i><p class="text-sm text-gray-400">কোনো ব্যান করা হোস্ট নেই</p></div>
                            </template>
                            <template x-for="h in bannedHosts" :key="h._id">
                                <div class="glass rounded-2xl p-4 flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-ban text-red-400"></i></div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-white truncate" x-text="h.title"></p>
                                        <p class="text-[10px] mono text-red-300 truncate" x-text="'/p/' + h.slug"></p>
                                    </div>
                                    <button @click="toggleHostBan(h)" class="btn-success px-3 py-2 rounded-lg text-[10px] font-black text-white">UNBAN</button>
                                    <button @click="deleteHost(h._id)" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- ============ GLOBAL REDIRECT ============ -->
                    <template x-if="section === 'redirect'">
                        <div class="fade-in max-w-2xl">
                            <div class="glass rounded-2xl p-6">
                                <h3 class="font-black text-lg mb-4">🔀 Global Redirect</h3>
                                <p class="text-xs text-gray-400 mb-4">সব হোস্ট করা লিংক এই URL-এ রিডাইরেক্ট হবে।</p>
                                <div class="space-y-3">
                                    <input type="text" x-model="redirectUrl" placeholder="https://example.com" class="premium-input w-full px-4 py-3 text-sm">
                                    <div class="flex gap-2">
                                        <button @click="applyRedirect()" class="btn-primary flex-1 py-3 rounded-xl text-xs font-black text-white">✓ চালু</button>
                                        <button @click="clearRedirect()" class="btn-danger flex-1 py-3 rounded-xl text-xs font-black text-white">✗ বন্ধ</button>
                                    </div>
                                    <template x-if="redirectActive">
                                        <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-3 text-xs text-emerald-300 mono truncate">Active: <span x-text="redirectActive"></span></div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ============ ANALYTICS ============ -->
                    <template x-if="section === 'analytics'">
                        <div class="fade-in space-y-4">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                <div class="glass rounded-2xl p-5"><div class="text-[10px] mono text-gray-400 mb-2">TOTAL VIEWS</div><div class="text-3xl font-black text-cyan-300" x-text="totalViews"></div></div>
                                <div class="glass rounded-2xl p-5"><div class="text-[10px] mono text-gray-400 mb-2">AVG VIEWS</div><div class="text-3xl font-black text-indigo-300" x-text="avgViews"></div></div>
                                <div class="glass rounded-2xl p-5"><div class="text-[10px] mono text-gray-400 mb-2">TOP SITE</div><div class="text-xs font-black text-emerald-300 truncate" x-text="topSite"></div></div>
                                <div class="glass rounded-2xl p-5"><div class="text-[10px] mono text-gray-400 mb-2">ACTIVE</div><div class="text-3xl font-black text-orange-300" x-text="hosts.filter(h => !h.banned).length"></div></div>
                            </div>
                        </div>
                    </template>

                    <!-- ============ ACTIVITY LOG ============ -->
                    <template x-if="section === 'activity-log'">
                        <div class="fade-in space-y-3">
                            <div class="flex gap-2 flex-wrap">
                                <input type="text" x-model="logSearch" placeholder="🔍 অ্যাক্টিভিটি সার্চ..." class="premium-input flex-1 px-4 py-3 text-sm">
                                <button @click="loadLogs()" class="btn-primary px-4 py-3 rounded-xl text-xs font-black text-white"><i class="fa-solid fa-rotate mr-1"></i> রিফ্রেশ</button>
                            </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        function adminApp() {
            return {
                loggedIn: false, password: '', showPass: false, loginError: '',
                section: 'dashboard', mobileMenu: false, loading: false,
                hosts: [], hostSearch: '', statusFilter: 'all', selectedHosts: [],
                redirectUrl: '', redirectActive: '',
                showCodeModal: false, editingHost: null,
                passwordForm: { old: '', new: '', confirm: '' },
                activityLogs: [], logSearch: '',
                notifications: [], unreadNotifs: 0,
                systemStatus: null,
                showToast: false, toastMessage: '', toastSubtext: '', toastType: 'success',
                editingPasswordId: null, newPasswordValue: '',
                showRedirectModal: false, redirectHost: null, redirectForm: { url: '' },
                showQRModal: false, qrUrl: '', qrInstance: null,
                
                settings: {
                    siteTitle: 'FreeHost BD', siteTagline: 'Premium HTML Deployment',
                    heroTitle: 'Deploy HTML in Seconds',
                    heroSubtitle: 'Paste your HTML code and get a live link instantly. No login required.',
                    footerText: 'FreeHost BD',
                    maintenanceMode: false,
                    maintenanceMessage: 'We are currently under maintenance. Please check back soon.',
                    htmlHostTitle: 'HTML Source Code', htmlHostSubtitle: 'Paste or drag & drop your HTML file',
                    projectTitleLabel: 'Project Title', projectTitleSubtitle: 'Empty হলে auto-generate হবে',
                    customUrlLabel: 'Custom URL', customUrlSubtitle: 'Empty হলে random slug হবে',
                    accessPasswordLabel: 'Access Password', accessPasswordSubtitle: 'Empty রাখলে পাসওয়ার্ড ছাড়াই খুলবে',
                    deployButtonText: 'DEPLOY TO CLOUD',
                    deploySuccessTitle: 'Success! 🎉', deploySuccessMessage: 'Your site is now live',
                    photoHostTitle: 'Click or Drop Image', photoHostSubtitle: 'JPG, PNG, WEBP • Max 5MB',
                    photoUploadButton: 'Upload & Get Link',
                    photoSuccessTitle: 'Upload Successful! 🎉', photoSuccessMessage: 'Your image is live',
                    navHtmlLabel: 'HTML Host', navPhotoLabel: 'Photo Host',
                    navShopLabel: 'Shop', navAccountLabel: 'Account', navDashboardLabel: 'Dashboard',
                    footerBrandText: 'FreeHost BD', footerBrandSubtitle: 'PREMIUM PROJECT'
                },

                menuGroups: [
                    { label: '📊 Main', items: [{ id: 'dashboard', label: 'ড্যাশবোর্ড', icon: 'fa-chart-line' }] },
                    { label: '🌐 Hosting', items: [
                        { id: 'hosts', label: 'All Hosts', icon: 'fa-cloud' },
                        { id: 'banned-hosts', label: 'Banned Hosts', icon: 'fa-ban' },
                        { id: 'redirect', label: 'Global Redirect', icon: 'fa-arrow-right-arrow-left' },
                        { id: 'analytics', label: 'Analytics', icon: 'fa-chart-simple' }
                    ]},
                    { label: '🎨 CMS', items: [
                        { id: 'cms', label: 'Site Settings', icon: 'fa-pen-to-square' },
                        { id: 'maintenance', label: 'Maintenance', icon: 'fa-wrench' }
                    ]},
                    { label: '🔔 System', items: [
                        { id: 'notifications', label: 'Notifications', icon: 'fa-bell', badge: () => this.unreadNotifs },
                        { id: 'activity-log', label: 'Activity Log', icon: 'fa-list' },
                        { id: 'system-status', label: 'System Status', icon: 'fa-server' }
                    ]}
                ],

                get sectionTitle() {
                    for (const g of this.menuGroups) { const m = g.items.find(i => i.id === this.section); if (m) return m.label; }
                    return 'Dashboard';
                },
                get bannedHosts() { return this.hosts.filter(h => h.banned); },
                get totalViews() { return this.hosts.reduce((s, h) => s + (h.views || 0), 0); },
                get avgViews() { return this.hosts.length ? Math.round(this.totalViews / this.hosts.length) : 0; },
                get topSite() { const s = [...this.hosts].sort((a, b) => (b.views || 0) - (a.views || 0))[0]; return s ? s.title : '—'; },
                get filteredHosts() {
                    let list = this.hosts;
                    if (this.statusFilter === 'active') list = list.filter(h => !h.banned);
                    else if (this.statusFilter === 'banned') list = list.filter(h => h.banned);
                    else if (this.statusFilter === 'password') list = list.filter(h => h.password);
                    const q = this.hostSearch.toLowerCase();
                    if (q) list = list.filter(h => h.title.toLowerCase().includes(q) || h.slug.toLowerCase().includes(q));
                    return list;
                },
                get filteredLogs() {
                    if (!this.logSearch) return this.activityLogs;
                    const q = this.logSearch.toLowerCase();
                    return this.activityLogs.filter(l => l.action.toLowerCase().includes(q) || (l.details || '').toLowerCase().includes(q));
                },
                get onlineNow() {
                    return this.hosts.filter(h => h.lastActive && (Date.now() - new Date(h.lastActive).getTime()) < 5 * 60 * 1000).length;
                },
                isOnline(h) {
                    if (!h.lastActive) return false;
                    return (Date.now() - new Date(h.lastActive).getTime()) < 5 * 60 * 1000;
                },

                init() {
                    const saved = localStorage.getItem('admin_logged_in');
                    if (saved === 'true') {
                        this.loggedIn = true;
                        this.loadAll();
                    }
                },

                async loadAll() {
                    this.loading = true;
                    try {
                        await Promise.all([
                            this.loadHosts(),
                            this.loadRedirect(),
                            this.loadSettings(),
                            this.loadLogs(),
                            this.loadNotifications(),
                            this.loadSystemStatus()
                        ]);
                    } catch(e) {}
                    this.loading = false;
                },

                async loadHosts() {
                    try {
                        const res = await fetch('/api/admin/hosts', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        this.hosts = await res.json();
                    } catch(e) {}
                },
                async loadRedirect() {
                    try {
                        const res = await fetch('/api/admin/redirect', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        const data = await res.json();
                        this.redirectUrl = data.url || '';
                        this.redirectActive = data.url || '';
                    } catch(e) {}
                },
                async loadSettings() {
                    try {
                        const res = await fetch('/api/admin/settings', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        Object.assign(this.settings, await res.json());
                    } catch(e) {}
                },
                async loadLogs() {
                    try {
                        const res = await fetch('/api/admin/logs', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        this.activityLogs = await res.json();
                    } catch(e) {}
                },
                async loadNotifications() {
                    try {
                        const res = await fetch('/api/admin/notifications', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        this.notifications = await res.json();
                        this.unreadNotifs = this.notifications.filter(n => !n.read).length;
                    } catch(e) {}
                },
                async loadSystemStatus() {
                    try {
                        const res = await fetch('/api/admin/system-status', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        this.systemStatus = await res.json();
                    } catch(e) {}
                },

                refreshData() { this.loadAll(); this.showToastMsg('রিফ্রেশ', 'ডেটা লোড'); },

                login() {
                    this.loginError = '';
                    if (this.password === 'NOBITA_VIP') {
                        this.loggedIn = true;
                        localStorage.setItem('admin_logged_in', 'true');
                        this.loadAll();
                    } else { this.loginError = 'ভুল পাসওয়ার্ড'; }
                },
                logout() { this.loggedIn = false; localStorage.removeItem('admin_logged_in'); this.password = ''; },

                toggleSelect(id) {
                    const idx = this.selectedHosts.indexOf(id);
                    if (idx > -1) this.selectedHosts.splice(idx, 1);
                    else this.selectedHosts.push(id);
                },

                async bulkAction(action) {
                    if (this.selectedHosts.length === 0) return;
                    const actionText = action === 'delete' ? 'ডিলিট' : action === 'ban' ? 'ব্যান' : 'আনব্যান';
                    if (!confirm(`${this.selectedHosts.length} টি হোস্ট ${actionText} করবেন?`)) return;
                    try {
                        const res = await fetch('/api/admin/hosts/bulk', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ ids: this.selectedHosts, action })
                        });
                        if (res.ok) {
                            this.selectedHosts = [];
                            this.loadHosts();
                            this.showToastMsg('সফল', actionText);
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async toggleHostBan(h) {
                    const res = await fetch('/api/admin/hosts/' + h._id + '/ban', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ banned: !h.banned }) });
                    if (res.ok) { h.banned = !h.banned; this.showToastMsg('সফল', h.banned ? 'ব্যান' : 'আনব্যান'); }
                },
                async deleteHost(id) {
                    if (!confirm('নিশ্চিত?')) return;
                    const res = await fetch('/api/admin/hosts/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    if (res.ok) { this.hosts = this.hosts.filter(h => h._id !== id); this.showToastMsg('ডিলিট', ''); }
                },
                viewCode(h) { this.editingHost = { ...h }; this.showCodeModal = true; },
                async saveCode() {
                    const res = await fetch('/api/admin/hosts/' + this.editingHost._id, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ code: this.editingHost.code }) });
                    if (res.ok) { const idx = this.hosts.findIndex(h => h._id === this.editingHost._id); if (idx > -1) this.hosts[idx].code = this.editingHost.code; this.showCodeModal = false; this.showToastMsg('সেভ', ''); }
                },
                downloadCode(h) {
                    if (!h.code) return this.showToastMsg('কোড নেই', '', 'error');
                    const blob = new Blob([h.code], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = (h.slug || 'site') + '.html';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.showToastMsg('ডাউনলোড', h.slug + '.html');
                },

                showQR(h) {
                    this.qrUrl = window.location.origin + '/p/' + h.slug;
                    this.showQRModal = true;
                    this.$nextTick(() => {
                        const container = document.getElementById('qrContainer');
                        container.innerHTML = '';
                        new QRCode(container, {
                            text: this.qrUrl,
                            width: 220,
                            height: 220,
                            colorDark: "#000000",
                            colorLight: "#ffffff"
                        });
                    });
                },
                downloadQR() {
                    const canvas = document.querySelector('#qrContainer canvas');
                    if (!canvas) return;
                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = 'qrcode-' + Date.now() + '.png';
                    a.click();
                },

                startEditPassword(id, currentPassword) { this.editingPasswordId = id; this.newPasswordValue = currentPassword; },
                cancelEditPassword() { this.editingPasswordId = null; this.newPasswordValue = ''; },
                async savePassword(id) {
                    try {
                        const res = await fetch('/api/admin/hosts/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ password: this.newPasswordValue || null }) });
                        if (res.ok) { const idx = this.hosts.findIndex(h => h._id === id); if (idx > -1) this.hosts[idx].password = this.newPasswordValue || null; this.cancelEditPassword(); this.showToastMsg('আপডেট ✓', ''); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                openRedirectModal(h) { this.redirectHost = { ...h }; this.redirectForm.url = h.redirectUrl || ''; this.showRedirectModal = true; },
                async saveHostRedirect() {
                    try {
                        const res = await fetch('/api/admin/hosts/' + this.redirectHost._id, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ redirectUrl: this.redirectForm.url || null }) });
                        if (res.ok) { const idx = this.hosts.findIndex(h => h._id === this.redirectHost._id); if (idx > -1) this.hosts[idx].redirectUrl = this.redirectForm.url || null; this.showRedirectModal = false; this.showToastMsg('সেভ ✓', ''); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },
                async removeHostRedirect() {
                    try {
                        const res = await fetch('/api/admin/hosts/' + this.redirectHost._id, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ redirectUrl: null }) });
                        if (res.ok) { const idx = this.hosts.findIndex(h => h._id === this.redirectHost._id); if (idx > -1) this.hosts[idx].redirectUrl = null; this.showRedirectModal = false; this.showToastMsg('বন্ধ', ''); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async applyRedirect() {
                    if (!this.redirectUrl) return this.showToastMsg('লিংক দিন', '', 'error');
                    const res = await fetch('/api/admin/redirect', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ url: this.redirectUrl }) });
                    if (res.ok) { this.redirectActive = this.redirectUrl; this.showToastMsg('চালু ✓', ''); }
                },
                async clearRedirect() {
                    const res = await fetch('/api/admin/redirect', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ url: '' }) });
                    if (res.ok) { this.redirectActive = ''; this.redirectUrl = ''; this.showToastMsg('বন্ধ', ''); }
                },

                async saveSettings() {
                    try {
                        const res = await fetch('/api/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify(this.settings) });
                        if (res.ok) this.showToastMsg('সেভ ✓', 'সব পেজে আপডেট হবে');
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async toggleMaintenance() {
                    const current = this.settings.maintenanceMode === true || this.settings.maintenanceMode === 'true';
                    this.settings.maintenanceMode = !current;
                    await this.saveSettings();
                },

                async markAllRead() {
                    await fetch('/api/admin/notifications/read', { method: 'POST', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    this.loadNotifications();
                },
                async clearNotifications() {
                    if (!confirm('সব নোটিফিকেশন মুছবেন?')) return;
                    await fetch('/api/admin/notifications', { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    this.notifications = [];
                    this.unreadNotifs = 0;
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg; this.toastSubtext = sub; this.toastType = type; this.showToast = true;
                    clearTimeout(this._t); this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
