<!DOCTYPE html>
<html lang="bn" x-data="adminApp()" x-init="init()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        body {
            background: #030712;
            color: #f3f4f6;
            min-height: 100vh;
        }

        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .sidebar-bg {
            background: linear-gradient(180deg, #0a0e1a 0%, #050811 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        .menu-item {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .menu-item:hover {
            background: rgba(99, 102, 241, 0.08);
            color: #fff;
        }
        .menu-item.active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.08));
            color: #fff;
            box-shadow: inset 3px 0 0 #818cf8;
        }
        .menu-item.active i:first-child {
            color: #a5b4fc;
            filter: drop-shadow(0 0 6px rgba(165, 180, 252, 0.7));
        }

        .group-label {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(148, 163, 184, 0.5);
            padding: 12px 12px 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.7);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -4px rgba(99, 102, 241, 0.9); }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 24px -6px rgba(239, 68, 68, 0.6);
        }
        .btn-danger:hover { transform: translateY(-2px); }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.6);
        }
        .btn-success:hover { transform: translateY(-2px); }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 8px 24px -6px rgba(245, 158, 11, 0.6);
        }
        .btn-warning:hover { transform: translateY(-2px); }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .premium-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }
        .premium-input::placeholder { color: rgba(148, 163, 184, 0.5); }

        .stat-card {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.3);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            transition: left 0.6s;
        }
        .stat-card:hover::before { left: 100%; }

        .table-row {
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .table-row:hover {
            background: rgba(99, 102, 241, 0.06);
        }

        .badge {
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.35s ease; }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .slide-in { animation: slideIn 0.3s ease; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-up { animation: slideUp 0.3s ease; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            color: #a5b4fc;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.3), transparent);
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state i {
            font-size: 48px;
            color: rgba(148, 163, 184, 0.2);
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            transition: all 0.25s;
            border: 1px solid transparent;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        .tab-btn:not(.active) {
            background: rgba(255,255,255,0.03);
            color: rgba(148, 163, 184, 0.8);
            border-color: rgba(255,255,255,0.06);
        }
        .tab-btn:not(.active):hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <template x-if="!loggedIn">
        <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
            <div class="absolute inset-0 pointer-events-none">
                <div class="absolute top-0 left-1/4 w-96 h-96 rounded-full bg-indigo-600/20 blur-3xl"></div>
                <div class="absolute bottom-0 right-1/4 w-96 h-96 rounded-full bg-purple-600/20 blur-3xl"></div>
            </div>

            <div class="glass-strong rounded-3xl p-8 max-w-md w-full slide-up relative z-10">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-600 to-cyan-400 flex items-center justify-center shadow-2xl mb-5">
                        <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-black text-white mb-1">Admin Panel</h1>
                    <p class="text-[10px] text-indigo-300 mono tracking-widest">FREEHOST BD — CONTROL CENTER</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-300 mb-2 block">এডমিন পাসওয়ার্ড</label>
                        <div class="relative">
                            <input :type="showPass ? 'text' : 'password'" x-model="password" @keyup.enter="login()" 
                                   placeholder="Enter admin password"
                                   class="premium-input w-full px-4 py-3.5 text-sm pr-12">
                            <button @click="showPass = !showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                                <i :class="showPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" class="text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <button @click="login()" class="btn-primary w-full py-4 rounded-2xl font-black text-sm text-white">
                        <i class="fa-solid fa-unlock mr-2"></i> লগইন করুন
                    </button>

                    <template x-if="loginError">
                        <div class="bg-red-500/20 border border-red-500/30 rounded-2xl p-3 text-center slide-up">
                            <p class="text-xs font-bold text-red-300"><i class="fa-solid fa-circle-exclamation mr-1"></i> <span x-text="loginError"></span></p>
                        </div>
                    </template>

                    <p class="text-[10px] text-center text-gray-500 mono">
                        <i class="fa-solid fa-lock mr-1"></i> একবার লগইন করলে লগআউট না করা পর্যন্ত থাকবে
                    </p>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template x-if="loggedIn">
        <div class="flex min-h-screen relative">

            <!-- MOBILE OVERLAY -->
            <div x-show="mobileMenu" x-cloak @click="mobileMenu = false" 
                 x-transition:enter="transition-opacity duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 lg:hidden"></div>

            <!-- SIDEBAR -->
            <aside :class="mobileMenu ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
                   class="fixed lg:sticky top-0 left-0 w-64 h-screen sidebar-bg z-50 lg:z-10 flex flex-col transition-transform duration-300 overflow-hidden">

                <div class="flex items-center gap-3 px-4 py-4 border-b border-white/5 flex-shrink-0">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-600 to-cyan-400 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-shield-halved text-white text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-black text-white truncate">FreeHost BD</div>
                        <div class="text-[9px] mono text-indigo-300 tracking-wider">ADMIN v2.0</div>
                    </div>
                    <button @click="mobileMenu = false" class="lg:hidden w-8 h-8 rounded-lg btn-ghost flex items-center justify-center">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <nav class="flex-1 overflow-y-auto px-2 py-3">
                    <template x-for="group in menuGroups" :key="group.label">
                        <div class="mb-2">
                            <div class="group-label" x-text="group.label"></div>
                            <template x-for="item in group.items" :key="item.id">
                                <button @click="section = item.id; mobileMenu = false"
                                        :class="section === item.id ? 'active' : 'text-gray-400'"
                                        class="menu-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3 mb-0.5">
                                    <i :class="'fa-solid ' + item.icon" class="w-4 text-sm"></i>
                                    <span class="flex-1" x-text="item.label"></span>
                                    <template x-if="item.badge && item.badge() > 0">
                                        <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-amber-500 text-white" x-text="item.badge()"></span>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </template>
                </nav>

                <div class="p-3 border-t border-white/5 flex-shrink-0">
                    <div class="glass rounded-xl p-3 mb-2">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-emerald-400 rounded-full pulse-dot"></span>
                            <span class="text-[10px] mono font-bold text-emerald-300">SYSTEM ONLINE</span>
                        </div>
                    </div>
                    <button @click="logout()" class="w-full text-xs font-bold text-red-400 hover:text-red-300 px-3 py-2.5 rounded-xl hover:bg-red-500/10 flex items-center gap-3 transition">
                        <i class="fa-solid fa-right-from-bracket w-4"></i> লগআউট
                    </button>
                </div>
            </aside>

            <!-- MAIN CONTENT -->
            <main class="flex-1 min-w-0 flex flex-col">

                <!-- TOP BAR -->
                <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 lg:px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <button @click="mobileMenu = true" class="lg:hidden w-10 h-10 rounded-xl btn-ghost flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-bars text-sm"></i>
                        </button>
                        <div class="min-w-0">
                            <h1 class="text-sm lg:text-base font-black text-white truncate" x-text="sectionTitle"></h1>
                            <p class="text-[10px] mono text-gray-500 truncate">
                                Admin <span class="text-indigo-400 mx-1">/</span> <span x-text="sectionTitle"></span>
                            </p>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 flex-shrink-0">
                        <button @click="refreshData()" class="w-9 h-9 rounded-xl btn-ghost flex items-center justify-center" title="Refresh">
                            <i class="fa-solid fa-rotate text-xs" :class="loading ? 'fa-spin' : ''"></i>
                        </button>
                        <div class="hidden sm:flex items-center gap-2 px-3 py-2 rounded-xl glass">
                            <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-[10px] font-black">A</div>
                            <span class="text-[11px] font-bold">Admin</span>
                        </div>
                    </div>
                </header>

                <div class="flex-1 p-4 lg:p-6 overflow-x-hidden">

                    <!-- ============ DASHBOARD ============ -->
                    <template x-if="section === 'dashboard'">
                        <div class="fade-in space-y-5">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="w-9 h-9 rounded-xl bg-indigo-500/20 flex items-center justify-center">
                                            <i class="fa-solid fa-users text-indigo-400 text-sm"></i>
                                        </div>
                                        <span class="text-[9px] mono text-gray-500 font-bold">TOTAL</span>
                                    </div>
                                    <div class="text-3xl font-black text-indigo-300" x-text="users.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">মোট ইউজার</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="w-9 h-9 rounded-xl bg-cyan-500/20 flex items-center justify-center">
                                            <i class="fa-solid fa-cloud text-cyan-400 text-sm"></i>
                                        </div>
                                        <span class="text-[9px] mono text-gray-500 font-bold">HOSTED</span>
                                    </div>
                                    <div class="text-3xl font-black text-cyan-300" x-text="hosts.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">হোস্টেড সাইট</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="w-9 h-9 rounded-xl bg-amber-500/20 flex items-center justify-center">
                                            <i class="fa-solid fa-clock text-amber-400 text-sm"></i>
                                        </div>
                                        <span class="text-[9px] mono text-gray-500 font-bold">PENDING</span>
                                    </div>
                                    <div class="text-3xl font-black text-amber-300" x-text="pendingDeposits"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">অপেক্ষমাণ ডিপোজিট</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="w-9 h-9 rounded-xl bg-orange-500/20 flex items-center justify-center">
                                            <i class="fa-solid fa-bag-shopping text-orange-400 text-sm"></i>
                                        </div>
                                        <span class="text-[9px] mono text-gray-500 font-bold">ORDERS</span>
                                    </div>
                                    <div class="text-3xl font-black text-orange-300" x-text="orders.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">মোট অর্ডার</div>
                                </div>
                            </div>

                            <div class="grid lg:grid-cols-2 gap-4">
                                <div class="glass rounded-2xl p-5">
                                    <div class="section-title"><i class="fa-solid fa-chart-line"></i> সার্ভার স্ট্যাটাস</div>
                                    <div class="space-y-3">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs text-gray-400">Uptime</span>
                                            <span class="text-xs font-black text-emerald-400">99.9%</span>
                                        </div>
                                        <div class="h-1.5 bg-black/50 rounded-full overflow-hidden">
                                            <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full" style="width: 99.9%"></div>
                                        </div>
                                        <div class="flex items-center justify-between mt-4">
                                            <span class="text-xs text-gray-400">Database</span>
                                            <span class="text-xs font-black text-emerald-400">Connected</span>
                                        </div>
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs text-gray-400">Storage Used</span>
                                            <span class="text-xs font-black text-cyan-400">32%</span>
                                        </div>
                                        <div class="h-1.5 bg-black/50 rounded-full overflow-hidden">
                                            <div class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full" style="width: 32%"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="glass rounded-2xl p-5">
                                    <div class="section-title"><i class="fa-solid fa-bolt"></i> সাম্প্রতিক অ্যাক্টিভিটি</div>
                                    <div class="space-y-2">
                                        <template x-for="(log, i) in activityLogs.slice(0, 5)" :key="i">
                                            <div class="flex items-center gap-3 py-2 border-b border-white/5 last:border-0">
                                                <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center flex-shrink-0">
                                                    <i class="fa-solid fa-circle text-indigo-400 text-[6px]"></i>
                                                </div>
                                                <div class="flex-1 min-w-0">
                                                    <p class="text-xs font-bold text-white truncate" x-text="log.action"></p>
                                                    <p class="text-[10px] text-gray-500 mono" x-text="log.time"></p>
                                                </div>
                                            </div>
                                        </template>
                                        <template x-if="activityLogs.length === 0">
                                            <p class="text-xs text-gray-500 text-center py-4">কোনো লগ নেই</p>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ============ ALL USERS ============ -->
                    <template x-if="section === 'users'">
                        <div class="fade-in space-y-4">
                            <div class="flex flex-wrap gap-2">
                                <input type="text" x-model="userSearch" placeholder="🔍 নাম বা নাম্বার..." class="premium-input flex-1 min-w-[200px] px-4 py-3 text-sm">
                            </div>

                            <div class="glass rounded-2xl overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full">
                                        <thead class="bg-black/30">
                                            <tr class="text-left">
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase">User</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase">Phone</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase">Balance</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase">Status</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="u in filteredUsers" :key="u._id">
                                                <tr class="table-row">
                                                    <td class="px-4 py-3">
                                                        <div class="flex items-center gap-2">
                                                            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-[11px] font-black text-white flex-shrink-0">
                                                                <span x-text="u.name.charAt(0).toUpperCase()"></span>
                                                            </div>
                                                            <span class="text-xs font-bold text-white truncate" x-text="u.name"></span>
                                                        </div>
                                                    </td>
                                                    <td class="px-4 py-3 text-xs mono text-gray-300" x-text="u.phone"></td>
                                                    <td class="px-4 py-3 text-xs font-black text-emerald-400 mono">৳<span x-text="u.balance || 0"></span></td>
                                                    <td class="px-4 py-3">
                                                        <span class="badge" :class="u.banned ? 'bg-red-500/20 text-red-300' : 'bg-emerald-500/20 text-emerald-300'" x-text="u.banned ? 'BANNED' : 'ACTIVE'"></span>
                                                    </td>
                                                    <td class="px-4 py-3 text-right">
                                                        <div class="flex items-center gap-1 justify-end">
                                                            <button @click="toggleUserBan(u)" :class="u.banned ? 'btn-success' : 'btn-warning'" class="px-3 py-1.5 rounded-lg text-[9px] font-black text-white">
                                                                <span x-text="u.banned ? 'UNBAN' : 'BAN'"></span>
                                                            </button>
                                                        </div>

                get sectionTitle() {
                    for (const g of this.menuGroups) {
                        const m = g.items.find(i => i.id === this.section);
                        if (m) return m.label;
                    }
                    return 'Dashboard';
                },

                get pendingDeposits() { return this.deposits.filter(d => d.status === 'pending').length; },
                get approvedDeposits() { return this.deposits.filter(d => d.status === 'approved'); },
                get bannedUsers() { return this.users.filter(u => u.banned); },
                get bannedHosts() { return this.hosts.filter(h => h.banned); },
                get totalIn() { return this.approvedDeposits.reduce((s, d) => s + (d.amount || 0), 0); },
                get totalViews() { return this.hosts.reduce((s, h) => s + (h.views || 0), 0); },
                get avgViews() { return this.hosts.length ? Math.round(this.totalViews / this.hosts.length) : 0; },
                get topSite() { const s = [...this.hosts].sort((a, b) => (b.views || 0) - (a.views || 0))[0]; return s ? s.title : '—'; },
                get topSites() { return [...this.hosts].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10); },

                get filteredUsers() {
                    const q = this.userSearch.toLowerCase();
                    if (!q) return this.users;
                    return this.users.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q));
                },

                get filteredHosts() {
                    const q = this.hostSearch.toLowerCase();
                    if (!q) return this.hosts;
                    return this.hosts.filter(h => h.title.toLowerCase().includes(q) || h.slug.toLowerCase().includes(q));
                },

                get filteredDeposits() {
                    if (this.depositFilter === 'all') return this.deposits;
                    return this.deposits.filter(d => d.status === this.depositFilter);
                },

                init() {
                    const saved = localStorage.getItem('admin_logged_in');
                    if (saved === 'true') {
                        this.loggedIn = true;
                        this.loadAll();
                    }
                    this.redirectActive = localStorage.getItem('global_redirect') || '';
                    const s = localStorage.getItem('site_settings');
                    if (s) { try { Object.assign(this.settings, JSON.parse(s)); } catch(e) {} }
                    const logs = localStorage.getItem('activity_logs');
                    if (logs) { try { this.activityLogs = JSON.parse(logs); } catch(e) {} }
                },

                login() {
                    this.loginError = '';
                    if (this.password === 'NOBITA_VIP') {
                        this.loggedIn = true;
                        localStorage.setItem('admin_logged_in', 'true');
                        this.addLog('Admin logged in');
                        this.loadAll();
                    } else {
                        this.loginError = 'ভুল পাসওয়ার্ড';
                    }
                },

                logout() {
                    this.addLog('Admin logged out');
                    this.loggedIn = false;
                    localStorage.removeItem('admin_logged_in');
                    this.password = '';
                },

                async loadAll() {
                    this.loading = true;
                    const headers = { 'x-admin-pass': 'NOBITA_VIP' };
                    try {
                        const [u, h, d, p, o] = await Promise.all([
                            fetch('/api/admin/users', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/hosts', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/deposits', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/products', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/orders', { headers }).then(r => r.json()).catch(() => [])
                        ]);
                        this.users = Array.isArray(u) ? u : (u.users || []);
                        this.hosts = Array.isArray(h) ? h : (h.hosts || []);
                        this.deposits = Array.isArray(d) ? d : (d.deposits || []);
                        this.products = Array.isArray(p) ? p : (p.products || []);
                        this.orders = Array.isArray(o) ? o : (o.orders || []);
                    } catch(e) {}
                    this.loading = false;
                },

                refreshData() { this.loadAll(); this.showToastMsg('রিফ্রেশ', 'ডেটা লোড হয়েছে'); },

                addLog(action) {
                    this.activityLogs.unshift({ action, time: new Date().toLocaleString('en-GB') });
                    if (this.activityLogs.length > 100) this.activityLogs = this.activityLogs.slice(0, 100);
                    localStorage.setItem('activity_logs', JSON.stringify(this.activityLogs));
                },

                clearLogs() {
                    if (!confirm('সব লগ মুছে ফেলবেন?')) return;
                    this.activityLogs = [];
                    localStorage.removeItem('activity_logs');
                    this.showToastMsg('ক্লিয়ার', 'লগ মুছে ফেলা হয়েছে');
                },

                getUserName(id) {
                    const u = this.users.find(x => x._id === id);
                    return u ? u.name : 'Unknown';
                },

                async toggleUserBan(u) {
                    try {
                        const res = await fetch('/api/admin/users/' + u._id + '/ban', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ banned: !u.banned })
                        });
                        if (res.ok) {
                            u.banned = !u.banned;
                            this.addLog((u.banned ? 'Banned user: ' : 'Unbanned user: ') + u.name);
                            this.showToastMsg('সফল', u.banned ? 'ইউজার ব্যান' : 'ইউজার আনব্যান');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async toggleHostBan(h) {
                    try {
                        const res = await fetch('/api/admin/hosts/' + h._id + '/ban', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ banned: !h.banned })
                        });
                        if (res.ok) {
                            h.banned = !h.banned;
                            this.addLog((h.banned ? 'Banned host: ' : 'Unbanned host: ') + h.slug);
                            this.showToastMsg('সফল', h.banned ? 'ব্যান' : 'আনব্যান');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async deleteHost(id) {
                    if (!confirm('নিশ্চিত? এই হোস্ট স্থায়ীভাবে মুছে যাবে।')) return;
                    try {
                        const res = await fetch('/api/admin/hosts/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        if (res.ok) {
                            const h = this.hosts.find(x => x._id === id);
                            this.hosts = this.hosts.filter(h => h._id !== id);
                            this.addLog('Deleted host: ' + (h ? h.slug : id));
                            this.showToastMsg('ডিলিট', 'হোস্ট মুছে ফেলা হয়েছে');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                viewCode(h) {
                    this.editingHost = { ...h };
                    this.showCodeModal = true;
                },

                async saveCode() {
                    try {
                        const res = await fetch('/api/admin/hosts/' + this.editingHost._id, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ code: this.editingHost.code })
                        });
                        if (res.ok) {
                            const idx = this.hosts.findIndex(h => h._id === this.editingHost._id);
                            if (idx > -1) this.hosts[idx].code = this.editingHost.code;
                            this.addLog('Edited code: ' + this.editingHost.slug);
                            this.showCodeModal = false;
                            this.showToastMsg('সেভ হয়েছে', 'লিংকে আপডেট হবে');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                downloadCode(h) {
                    const blob = new Blob([h.code], { type: 'text/html' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = h.slug + '.html';
                    a.click();
                    this.addLog('Downloaded code: ' + h.slug);
                },

                applyRedirect() {
                    if (!this.redirectUrl) return this.showToastMsg('লিংক দিন', '', 'error');
                    localStorage.setItem('global_redirect', this.redirectUrl);
                    this.redirectActive = this.redirectUrl;
                    this.addLog('Global redirect ON: ' + this.redirectUrl);
                    this.showToastMsg('রিডাইরেক্ট চালু', this.redirectUrl);
                },

                clearRedirect() {
                    localStorage.removeItem('global_redirect');
                    this.redirectActive = '';
                    this.addLog('Global redirect OFF');
                    this.showToastMsg('রিডাইরেক্ট বন্ধ', '');
                },

                async approveDeposit(d) {
                    try {
                        const res = await fetch('/api/admin/deposits/' + d._id + '/approve', {
                            method: 'POST',
                            headers: { 'x-admin-pass': 'NOBITA_VIP' }
                        });
                        if (res.ok) {
                            d.status = 'approved';
                            this.addLog('Approved deposit: ৳' + d.amount);
                            this.showToastMsg('অনুমোদিত ✓', '৳' + d.amount);
                            this.loadAll();
                        } else {
                            const err = await res.json();
                            this.showToastMsg('ব্যর্থ', err.error || 'সমস্যা', 'error');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async rejectDeposit(d) {
                    if (!confirm('বাতিল করবেন?')) return;
                    try {
                        const res = await fetch('/api/admin/deposits/' + d._id + '/reject', {
                            method: 'POST',
                            headers: { 'x-admin-pass': 'NOBITA_VIP' }
                        });
                        if (res.ok) {
                            d.status = 'rejected';
                            this.addLog('Rejected deposit: ৳' + d.amount);
                            this.showToastMsg('বাতিল', '');
                            this.loadAll();
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                openProductForm() {
                    this.productForm = { productId: '', name: '', imageUrl: '', category: 'HTML', price: 0, discountPrice: null, stock: 100, description: '', mainLink: '', mainCode: '', mainPassword: '', howToUse: '' };
                    this.showProductModal = true;
                },

                editProduct(p) {
                    this.productForm = { ...p };
                    this.showProductModal = true;
                },

                async saveProduct() {
                    try {
                        const url = this.productForm._id ? '/api/admin/products/' + this.productForm._id : '/api/admin/products';
                        const method = this.productForm._id ? 'PUT' : 'POST';
                        const res = await fetch(url, {
                            method,
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify(this.productForm)
                        });
                        if (res.ok) {
                            this.showProductModal = false;
                            this.addLog((this.productForm._id ? 'Edited' : 'Created') + ' product: ' + this.productForm.name);
                            this.showToastMsg('সেভ', 'প্রোডাক্ট সেভ হয়েছে');
                            this.loadAll();
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async deleteProduct(id) {
                    if (!confirm('নিশ্চিত?')) return;
                    try {
                        const res = await fetch('/api/admin/products/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        if (res.ok) {
                            const p = this.products.find(x => x._id === id);
                            this.products = this.products.filter(x => x._id !== id);
                            this.addLog('Deleted product: ' + (p ? p.name : id));
                            this.showToastMsg('ডিলিট', '');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async addManualBalance() {
                    if (!this.manualBalance.userId) return this.showToastMsg('ইউজার সিলেক্ট', '', 'error');
                    if (!this.manualBalance.amount) return this.showToastMsg('পরিমাণ দিন', '', 'error');
                    try {
                        const res = await fetch('/api/admin/users/' + this.manualBalance.userId + '/balance', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ amount: Number(this.manualBalance.amount), note: this.manualBalance.note })
                        });
                        if (res.ok) {
                            this.addLog('Manual balance: ৳' + this.manualBalance.amount);
                            this.showToastMsg('যোগ হয়েছে ✓', '৳' + this.manualBalance.amount);
                            this.manualBalance = { userId: '', amount: '', note: '' };
                            this.loadAll();
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                changePassword() {
                    if (!this.passwordForm.old || !this.passwordForm.new) return this.showToastMsg('সব ফিল্ড পূরণ করুন', '', 'error');
                    if (this.passwordForm.new !== this.passwordForm.confirm) return this.showToastMsg('পাসওয়ার্ড মিলছে না', '', 'error');
                    if (this.passwordForm.old !== 'NOBITA_VIP') return this.showToastMsg('পুরনো পাসওয়ার্ড ভুল', '', 'error');
                    localStorage.setItem('admin_pass', this.passwordForm.new);
                    this.addLog('Password changed');
                    this.passwordForm = { old: '', new: '', confirm: '' };
                    this.showToastMsg('সফল ✓', 'পাসওয়ার্ড পরিবর্তিত (শুধু local)');
                },

                saveSettings() {
                    localStorage.setItem('site_settings', JSON.stringify(this.settings));
                    this.addLog('Settings saved');
                    this.showToastMsg('সেটিংস সেভ', '');
                },

                downloadBackup() {
                    const data = {
                        users: this.users,
                        hosts: this.hosts.map(h => ({ ...h, code: h.code ? '[TRUNCATED]' : '' })),
                        deposits: this.deposits,
                        products: this.products,
                        orders: this.orders,
                        settings: this.settings,
                        exportedAt: new Date().toISOString()
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'freehostbd-backup-' + Date.now() + '.json';
                    a.click();
                    this.addLog('Backup downloaded');
                },

                exportAllCodes() {
                    this.hosts.forEach(h => {
                        const blob = new Blob([h.code], { type: 'text/html' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = h.slug + '.html';
                        a.click();
                    });
                    this.showToastMsg('ডাউনলোড শুরু', this.hosts.length + ' টি ফাইল');
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg;
                    this.toastSubtext = sub;
                    this.toastType = type;
                    this.showToast = true;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
