<!DOCTYPE html>
<html lang="bn" x-data="adminApp()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        body {
            background: #030712;
            color: #f3f4f6;
            min-height: 100vh;
        }

        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.7);
            transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -4px rgba(99, 102, 241, 0.9); }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 24px -6px rgba(239, 68, 68, 0.7);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.7);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 8px 24px -6px rgba(245, 158, 11, 0.7);
        }

        .sidebar-item {
            transition: all 0.25s ease;
            border-radius: 12px;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover {
            background: rgba(99, 102, 241, 0.1);
            border-left-color: rgba(99, 102, 241, 0.5);
        }
        .sidebar-item.active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.1));
            border-left-color: #6366f1;
            color: #fff;
        }

        .premium-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .pulse-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.35s ease; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <template x-if="!loggedIn">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div class="glass rounded-3xl p-8 max-w-md w-full fade-in">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-2xl mb-4">
                        <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-black text-white mb-1">Admin Panel</h1>
                    <p class="text-xs text-gray-400 mono">FreeHost BD — CONTROL CENTER</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-300 mb-2 block">এডমিন পাসওয়ার্ড</label>
                        <input :type="showPass ? 'text' : 'password'" x-model="password" @keyup.enter="login()" 
                               placeholder="Enter admin password"
                               class="premium-input w-full px-4 py-3.5 text-sm">
                    </div>

                    <button @click="login()" class="btn-primary w-full py-4 rounded-2xl font-black text-sm text-white">
                        🔓 লগইন করুন
                    </button>

                    <template x-if="loginError">
                        <div class="bg-red-500/20 border border-red-500/30 rounded-2xl p-3 text-center">
                            <p class="text-xs font-bold text-red-300" x-text="loginError"></p>
                        </div>
                    </template>

                    <p class="text-[10px] text-center text-gray-500 mono">একবার লগইন করলে লগআউট না করা পর্যন্ত থাকবে</p>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template x-if="loggedIn">
        <div class="flex min-h-screen">

            <!-- SIDEBAR -->
            <aside class="w-64 flex-shrink-0 hidden lg:flex flex-col glass border-r border-white/5 p-4 sticky top-0 h-screen overflow-y-auto">
                <div class="flex items-center gap-3 px-2 py-3 mb-4">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center">
                        <i class="fa-solid fa-shield-halved text-white"></i>
                    </div>
                    <div>
                        <div class="text-sm font-black">Admin</div>
                        <div class="text-[9px] mono text-indigo-300">FreeHost BD</div>
                    </div>
                </div>

                <nav class="flex-1 space-y-1">
                    <button @click="section = 'dashboard'" :class="section === 'dashboard' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-chart-line w-4"></i> ড্যাশবোর্ড
                    </button>
                    <button @click="section = 'users'" :class="section === 'users' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-users w-4"></i> ইউজার
                    </button>
                    <button @click="section = 'hosts'" :class="section === 'hosts' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-cloud w-4"></i> হোস্টিং
                    </button>
                    <button @click="section = 'deposits'" :class="section === 'deposits' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-money-bill-transfer w-4"></i> ডিপোজিট
                        <span x-show="pendingDeposits > 0" x-text="pendingDeposits" class="ml-auto bg-amber-500 text-white text-[9px] font-black px-1.5 py-0.5 rounded-full"></span>
                    </button>
                    <button @click="section = 'products'" :class="section === 'products' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-box w-4"></i> প্রোডাক্ট
                    </button>
                    <button @click="section = 'orders'" :class="section === 'orders' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-bag-shopping w-4"></i> অর্ডার
                    </button>
                    <button @click="section = 'settings'" :class="section === 'settings' ? 'active' : 'text-gray-400'" class="sidebar-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3">
                        <i class="fa-solid fa-gear w-4"></i> সেটিংস
                    </button>
                </nav>

                <button @click="logout()" class="mt-4 text-xs font-bold text-red-400 hover:text-red-300 px-3 py-2.5 rounded-xl hover:bg-red-500/10 flex items-center gap-3">
                    <i class="fa-solid fa-right-from-bracket w-4"></i> লগআউট
                </button>
            </aside>

            <!-- MAIN CONTENT -->
            <main class="flex-1 min-w-0">

                <!-- TOP BAR -->
                <header class="sticky top-0 z-20 glass border-b border-white/5 px-4 lg:px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button @click="mobileMenu = !mobileMenu" class="lg:hidden w-10 h-10 rounded-xl glass flex items-center justify-center">
                            <i class="fa-solid fa-bars text-sm"></i>
                        </button>
                        <div>
                            <h1 class="text-sm lg:text-base font-black capitalize" x-text="sectionTitle"></h1>
                            <p class="text-[10px] mono text-gray-400">Admin / <span x-text="section"></span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] mono text-emerald-400 px-3 py-1.5 rounded-lg bg-emerald-500/15 border border-emerald-500/30 flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full pulse-dot"></span>
                            ONLINE
                        </span>
                    </div>
                </header>

                <!-- MOBILE MENU -->
                <template x-if="mobileMenu">
                    <div class="lg:hidden glass border-b border-white/5 p-3 grid grid-cols-2 gap-2 fade-in">
                        <template x-for="item in menuItems" :key="item.id">
                            <button @click="section = item.id; mobileMenu = false" 
                                    :class="section === item.id ? 'bg-indigo-600 text-white' : 'glass text-gray-300'" 
                                    class="px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2">
                                <i :class="'fa-solid ' + item.icon"></i>
                                <span x-text="item.label"></span>
                            </button>
                        </template>
                    </div>
                </template>

                <div class="p-4 lg:p-6">

                    <!-- DASHBOARD -->
                    <template x-if="section === 'dashboard'">
                        <div class="fade-in">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4 mb-6">
                                <div class="glass rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <i class="fa-solid fa-users text-indigo-400"></i>
                                        <span class="text-[9px] mono text-gray-400">TOTAL</span>
                                    </div>
                                    <div class="text-3xl font-black text-indigo-300" x-text="users.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">ইউজার</div>
                                </div>
                                <div class="glass rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <i class="fa-solid fa-cloud text-cyan-400"></i>
                                        <span class="text-[9px] mono text-gray-400">HOSTED</span>
                                    </div>
                                    <div class="text-3xl font-black text-cyan-300" x-text="hosts.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">হোস্টেড সাইট</div>
                                </div>
                                <div class="glass rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <i class="fa-solid fa-clock text-amber-400"></i>
                                        <span class="text-[9px] mono text-gray-400">PENDING</span>
                                    </div>
                                    <div class="text-3xl font-black text-amber-300" x-text="pendingDeposits"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">ডিপোজিট অপেক্ষা</div>
                                </div>
                                <div class="glass rounded-2xl p-5">
                                    <div class="flex items-center justify-between mb-3">
                                        <i class="fa-solid fa-bag-shopping text-orange-400"></i>
                                        <span class="text-[9px] mono text-gray-400">ORDERS</span>
                                    </div>
                                    <div class="text-3xl font-black text-orange-300" x-text="orders.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">মোট অর্ডার</div>
                                </div>
                            </div>

                            <div class="glass rounded-2xl p-5">
                                <h3 class="font-black text-sm mb-3">📊 সার্ভার স্ট্যাটাস</h3>
                                <div class="grid sm:grid-cols-3 gap-3">
                                    <div class="bg-black/30 rounded-xl p-3">
                                        <div class="text-[10px] mono text-gray-400 mb-1">UPTIME</div>
                                        <div class="text-sm font-black text-emerald-400">99.9%</div>
                                    </div>
                                    <div class="bg-black/30 rounded-xl p-3">
                                        <div class="text-[10px] mono text-gray-400 mb-1">DATABASE</div>
                                        <div class="text-sm font-black text-emerald-400">Connected</div>
                                    </div>
                                    <div class="bg-black/30 rounded-xl p-3">
                                        <div class="text-[10px] mono text-gray-400 mb-1">BANDWIDTH</div>
                                        <div class="text-sm font-black text-cyan-400">Unlimited</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- USERS -->
                    <template x-if="section === 'users'">
                        <div class="fade-in">
                            <input type="text" x-model="userSearch" placeholder="🔍 নাম বা নাম্বার দিয়ে খুঁজুন..." class="premium-input w-full px-4 py-3 text-sm mb-4">
                            <div class="space-y-2">
                                <template x-for="u in filteredUsers" :key="u._id">
                                    <div class="glass rounded-2xl p-4 flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center font-black text-white">
                                            <span x-text="u.name.charAt(0).toUpperCase()"></span>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm font-bold truncate" x-text="u.name"></p>
                                            <p class="text-[10px] mono text-gray-400" x-text="u.phone + ' • ৳' + (u.balance || 0)"></p>
                                        </div>
                                        <button @click="toggleUserBan(u)" :class="u.banned ? 'btn-success' : 'btn-danger'" class="px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                            <span x-text="u.banned ? 'UNBAN' : 'BAN'"></span>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- HOSTS -->
                    <template x-if="section === 'hosts'">
                        <div class="fade-in">
                            <div class="flex flex-wrap gap-2 mb-4">
                                <input type="text" x-model="hostSearch" placeholder="🔍 হোস্ট করা লিংক সার্চ..." class="premium-input flex-1 min-w-[200px] px-4 py-3 text-sm">
                                <input type="text" x-model="redirectUrl" placeholder="🔗 সব লিংক redirect করবে..." class="premium-input flex-1 min-w-[200px] px-4 py-3 text-sm">
                                <button @click="applyRedirect()" class="btn-warning px-4 py-3 rounded-xl text-xs font-black text-white">REDIRECT ON</button>
                                <button @click="clearRedirect()" class="btn-danger px-4 py-3 rounded-xl text-xs font-black text-white">OFF</button>
                            </div>

                            <div class="space-y-2">
                                <template x-for="h in filteredHosts" :key="h._id">
                                    <div class="glass rounded-2xl p-4">
                                        <div class="flex items-start gap-3">
                                            <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center flex-shrink-0">
                                                <i class="fa-brands fa-html5 text-cyan-400"></i>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <p class="text-sm font-bold truncate" x-text="h.title"></p>
                                                    <span x-show="h.banned" class="text-[9px] font-black px-2 py-0.5 rounded-md bg-red-500/20 text-red-300">BANNED</span>
                                                </div>
                                                <p class="text-[10px] mono text-indigo-300 truncate mt-0.5" x-text="'/s/' + h.slug"></p>
                                                <p class="text-[10px] text-gray-500 mono mt-0.5">
                                                    👁 <span x-text="h.views || 0"></span> views • 
                                                    <span x-text="new Date(h.createdAt).toLocaleDateString('en-GB')"></span>
                                                </p>
                                            </div>
                                        </div>
                                        <div class="flex gap-2 mt-3 flex-wrap">
                                            <button @click="viewCode(h)" class="btn-primary px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                                <i class="fa-solid fa-code mr-1"></i> কোড
                                            </button>
                                            <a :href="'/s/' + h.slug" target="_blank" class="glass px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                                <i class="fa-solid fa-external-link mr-1"></i> ওপেন
                                            </a>
                                            <button @click="downloadCode(h)" class="glass px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                                <i class="fa-solid fa-download mr-1"></i> ডাউনলোড
                                            </button>
                                            <button @click="toggleHostBan(h)" :class="h.banned ? 'btn-success' : 'btn-warning'" class="px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                                <span x-text="h.banned ? 'UNBAN' : 'BAN'"></span>
                                            </button>
                                            <button @click="deleteHost(h._id)" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- DEPOSITS -->
                    <template x-if="section === 'deposits'">
                        <div class="fade-in">
                            <div class="flex gap-2 mb-4">
                                <button @click="depositFilter = 'pending'" :class="depositFilter === 'pending' ? 'bg-amber-600 text-white' : 'glass text-gray-400'" class="px-4 py-2 rounded-xl text-xs font-bold">
                                    অপেক্ষা <span x-text="pendingDeposits"></span>
                                </button>
                                <button @click="depositFilter = 'all'" :class="depositFilter === 'all' ? 'bg-indigo-600 text-white' : 'glass text-gray-400'" class="px-4 py-2 rounded-xl text-xs font-bold">সব</button>
                            </div>

                            <div class="space-y-2">
                                <template x-for="d in filteredDeposits" :key="d._id">
                                    <div class="glass rounded-2xl p-4">
                                        <div class="flex items-start gap-3 mb-3">
                                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
                                                 :class="d.status === 'approved' ? 'bg-emerald-500/20' : d.status === 'rejected' ? 'bg-red-500/20' : 'bg-amber-500/20'">
                                                <i class="fa-solid text-sm"
                                                   :class="d.status === 'approved' ? 'fa-check text-emerald-400' : d.status === 'rejected' ? 'fa-xmark text-red-400' : 'fa-clock text-amber-400'"></i>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <p class="text-base font-black text-white">৳ <span x-text="d.amount"></span></p>
                                                <p class="text-[10px] mono text-gray-400 mt-1">User: <span x-text="getUserName(d.userId)"></span></p>
                                                <p class="text-[10px] mono text-gray-400">From: <span class="text-indigo-300" x-text="d.senderNumber"></span></p>
                                                <p class="text-[10px] mono text-gray-400">TrxID: <span class="text-cyan-300" x-text="d.transactionId"></span></p>
                                                <p class="text-[10px] mono text-gray-500 mt-0.5" x-text="d.method + ' • ' + new Date(d.createdAt).toLocaleString('en-GB')"></p>
                                            </div>
                                        </div>
                                        <template x-if="d.status === 'pending'">
                                            <div class="flex gap-2">
                                                <button @click="approveDeposit(d)" class="btn-success flex-1 py-2.5 rounded-xl text-xs font-black text-white">✓ APPROVE</button>
                                                <button @click="rejectDeposit(d)" class="btn-danger flex-1 py-2.5 rounded-xl text-xs font-black text-white">✗ REJECT</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- PRODUCTS -->
                    <template x-if="section === 'products'">
                        <div class="fade-in">
                            <button @click="openProductForm()" class="btn-primary px-5 py-3 rounded-xl text-xs font-black text-white mb-4">
                                <i class="fa-solid fa-plus mr-1"></i> নতুন প্রোডাক্ট
                            </button>

                            <div class="space-y-2">
                                <template x-for="p in products" :key="p._id">
                                    <div class="glass rounded-2xl p-4 flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-orange-500/20 flex items-center justify-center flex-shrink-0">
                                            <i class="fa-solid fa-box text-orange-400 text-xs"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm font-bold truncate" x-text="p.name"></p>
                                            <p class="text-[10px] mono text-gray-400" x-text="'#' + p.productId + ' • ৳' + (p.discountPrice || p.price) + ' • ' + p.category"></p>
                                        </div>
                                        <button @click="editProduct(p)" class="glass px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <button @click="deleteProduct(p._id)" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- ORDERS -->
                    <template x-if="section === 'orders'">
                        <div class="fade-in space-y-2">
                            <template x-for="o in orders" :key="o._id">
                                <div class="glass rounded-2xl p-4 flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-orange-500/20 flex items-center justify-center">
                                        <i class="fa-solid fa-bag-shopping text-orange-400 text-xs"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold truncate" x-text="o.productName"></p>
                                        <p class="text-[10px] mono text-gray-400">User: <span x-text="getUserName(o.userId)"></span> • ৳<span x-text="o.price"></span></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- SETTINGS -->
                    <template x-if="section === 'settings'">
                        <div class="fade-in space-y-4">
                            <div class="glass rounded-2xl p-5">
                                <h3 class="font-black text-sm mb-4">💚 ডিপোজিট নাম্বার</h3>
                                <div class="space-y-3">
                                    <div>
                                        <label class="text-xs text-gray-400 mb-2 block">বিকাশ নাম্বার</label>
                                        <input type="text" x-model="settings.bkashNumber" class="premium-input w-full px-4 py-3 text-sm" placeholder="01XXXXXXXXX">
                                    </div>
                                    <div>
                                        <label class="text-xs text-gray-400 mb-2 block">নগদ নাম্বার</label>
                                        <input type="text" x-model="settings.nagadNumber" class="premium-input w-full px-4 py-3 text-sm" placeholder="01XXXXXXXXX">
                                    </div>
                                </div>
                            </div>

                            <div class="glass rounded-2xl p-5">
                                <h3 class="font-black text-sm mb-4">🎨 সাইট ব্র্যান্ডিং</h3>
                                <div class="space-y-3">
                                    <div>
                                        <label class="text-xs text-gray-400 mb-2 block">সাইট নাম</label>
                                        <input type="text" x-model="settings.siteName" class="premium-input w-full px-4 py-3 text-sm">
                                    </div>
                                    <div>
                                        <label class="text-xs text-gray-400 mb-2 block">ফুটার টেক্সট</label>
                                        <input type="text" x-model="settings.footerText" class="premium-input w-full px-4 py-3 text-sm">
                                    </div>
                                </div>
                            </div>

                            <button @click="saveSettings()" class="btn-primary w-full py-4 rounded-2xl text-sm font-black text-white">
                                💾 সেটিংস সেভ করুন
                            </button>
                        </div>
                    </template>
                </div>
            </main>
        </div>
    </template>

    <!-- CODE VIEWER MODAL -->
    <div x-show="showCodeModal" x-cloak @click.self="showCodeModal = false" class="fixed inset-0 z-50 flex items-center justify-center p-3" style="background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);">
        <div class="glass rounded-3xl max-w-3xl w-full max-h-[90vh] overflow-hidden flex flex-col fade-in">
            <div class="p-4 border-b border-white/10 flex items-center justify-between">
                <div>
                    <h3 class="font-black text-sm" x-text="editingHost ? editingHost.title : ''"></h3>
                    <p class="text-[10px] mono text-indigo-300" x-text="editingHost ? '/s/' + editingHost.slug : ''"></p>
                </div>
                <button @click="showCodeModal = false" class="w-8 h-8 rounded-lg glass flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
            <div class="flex-1 overflow-auto p-4">
                <textarea x-model="editingHost.code" class="w-full h-[400px] bg-black/50 text-cyan-200 p-4 rounded-xl mono text-xs outline-none border border-white/10 resize-none"></textarea>
            </div>
            <div class="p-4 border-t border-white/10 flex gap-2">
                <button @click="saveCode()" class="btn-success flex-1 py-3 rounded-xl text-xs font-black text-white">💾 সেভ করুন</button>
                <button @click="showCodeModal = false" class="glass px-5 py-3 rounded-xl text-xs font-black text-white">বাতিল</button>
            </div>
        </div>
    </div>

    <!-- PRODUCT FORM MODAL -->
    <div x-show="showProductModal" x-cloak @click.self="showProductModal = false" class="fixed inset-0 z-50 flex items-center justify-center p-3" style="background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);">
        <div class="glass rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5 fade-in">
            <div class="flex items-center justify-between mb-5">
                <h3 class="font-black text-lg" x-text="productForm._id ? '✏️ প্রোডাক্ট এডিট' : '➕ নতুন প্রোডাক্ট'"></h3>
                <button @click="showProductModal = false" class="w-8 h-8 rounded-lg glass flex items-center justify-center">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">প্রোডাক্ট নাম্বার (ID)</label>
                    <input type="text" x-model="productForm.productId" class="premium-input w-full px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">প্রোডাক্টের নাম</label>
                    <input type="text" x-model="productForm.name" class="premium-input w-full px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">ফটোর লিংক</label>
                    <input type="text" x-model="productForm.imageUrl" class="premium-input w-full px-4 py-3 text-sm" placeholder="https://...">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">ক্যাটাগরি</label>
                    <select x-model="productForm.category" class="premium-input w-full px-4 py-3 text-sm">
                        <option value="HTML">HTML</option>
                        <option value="PYTHON">PYTHON</option>
                        <option value="JAVASCRIPT">JAVASCRIPT</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">মূল্য (৳)</label>
                        <input type="number" x-model="productForm.price" class="premium-input w-full px-4 py-3 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">ডিসকাউন্ট (৳)</label>
                        <input type="number" x-model="productForm.discountPrice" class="premium-input w-full px-4 py-3 text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">স্টক</label>
                    <input type="number" x-model="productForm.stock" class="premium-input w-full px-4 py-3 text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">বর্ণনা</label>
                    <textarea x-model="productForm.description" class="premium-input w-full px-4 py-3 text-sm h-20 resize-none"></textarea>
                </div>

                <div class="border-t border-white/10 pt-3 mt-3">
                    <p class="text-xs font-black text-orange-300 mb-3">🔓 প্রোডাক্ট মেইন ডেটা (ক্রেতার জন্য)</p>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">মেইন লিংক</label>
                            <input type="text" x-model="productForm.mainLink" class="premium-input w-full px-4 py-3 text-sm">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">কোড</label>
                            <textarea x-model="productForm.mainCode" class="premium-input w-full px-4 py-3 text-sm h-24 mono text-xs resize-none"></textarea>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">পাসওয়ার্ড</label>
                            <input type="text" x-model="productForm.mainPassword" class="premium-input w-full px-4 py-3 text-sm">
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 mb-1 block">HOW TO USE লিংক</label>
                            <input type="text" x-model="productForm.howToUse" class="premium-input w-full px-4 py-3 text-sm">
                        </div>
                    </div>
                </div>

                <button @click="saveProduct()" class="btn-primary w-full py-4 rounded-2xl font-black text-sm text-white mt-3">
                    💾 সেভ করুন
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div x-show="showToast" x-cloak
         x-transition:enter="transform transition ease-out duration-300"
         x-transition:enter-start="translate-y-20 opacity-0"
         x-transition:enter-end="translate-y-0 opacity-100"
         class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] glass px-5 py-3 rounded-2xl flex items-center gap-3 max-w-sm">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
             :class="toastType === 'error' ? 'bg-red-500' : 'bg-emerald-500'">
            <i class="fa-solid text-sm text-white" :class="toastType === 'error' ? 'fa-xmark' : 'fa-check'"></i>
        </div>
        <div class="min-w-0">
            <p class="text-xs font-bold text-white" x-text="toastMessage"></p>
            <p class="text-[10px] text-gray-400 truncate" x-text="toastSubtext"></p>
        </div>
    </div>

    <script>
        function adminApp() {
            return {
                loggedIn: false,
                password: '',
                showPass: false,
                loginError: '',
                section: 'dashboard',
                mobileMenu: false,

                users: [],
                hosts: [],
                deposits: [],
                products: [],
                orders: [],

                userSearch: '',
                hostSearch: '',
                depositFilter: 'pending',
                redirectUrl: '',

                showCodeModal: false,
                editingHost: null,

                showProductModal: false,
                productForm: {},

                settings: {
                    bkashNumber: '01XXXXXXXXX',
                    nagadNumber: '01XXXXXXXXX',
                    siteName: 'FreeHost BD',
                    footerText: 'PREMIUM PROJECT'
                },

                showToast: false,
                toastMessage: '',
                toastSubtext: '',
                toastType: 'success',

                menuItems: [
                    { id: 'dashboard', label: 'ড্যাশবোর্ড', icon: 'fa-chart-line' },
                    { id: 'users', label: 'ইউজার', icon: 'fa-users' },
                    { id: 'hosts', label: 'হোস্টিং', icon: 'fa-cloud' },
                    { id: 'deposits', label: 'ডিপোজিট', icon: 'fa-money-bill-transfer' },
                    { id: 'products', label: 'প্রোডাক্ট', icon: 'fa-box' },
                    { id: 'orders', label: 'অর্ডার', icon: 'fa-bag-shopping' },
                    { id: 'settings', label: 'সেটিংস', icon: 'fa-gear' }
                ],

                get sectionTitle() {
                    const m = this.menuItems.find(i => i.id === this.section);
                    return m ? m.label : 'Dashboard';
                },

                get pendingDeposits() {
                    return this.deposits.filter(d => d.status === 'pending').length;
                },

                get filteredUsers() {
                    const q = this.userSearch.toLowerCase();
                    if (!q) return this.users;
                    return this.users.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q));
                },

                get filteredHosts() {
                    const q = this.hostSearch.toLowerCase();
                    if (!q) return this.hosts;
                    return this.hosts.filter(h => h.title.toLowerCase().includes(q) || h.slug.toLowerCase().includes(q));
                },

                get filteredDeposits() {
                    if (this.depositFilter === 'pending') return this.deposits.filter(d => d.status === 'pending');
                    return this.deposits;
                },

                init() {
                    const saved = localStorage.getItem('admin_logged_in');
                    if (saved === 'true') {
                        this.loggedIn = true;
                        this.loadAll();
                    }
                },

                login() {
                    this.loginError = '';
                    if (this.password === 'NOBITA_VIP') {
                        this.loggedIn = true;
                        localStorage.setItem('admin_logged_in', 'true');
                        this.loadAll();
                    } else {
                        this.loginError = 'ভুল পাসওয়ার্ড';
                    }
                },

                logout() {
                    this.loggedIn = false;
                    localStorage.removeItem('admin_logged_in');
                    this.password = '';
                },

                async loadAll() {
                    const token = localStorage.getItem('token');
                    const headers = { 'Authorization': token ? 'Bearer ' + token : '', 'x-admin-pass': 'NOBITA_VIP' };
                    try {
                        const [u, h, d, p, o] = await Promise.all([
                            fetch('/api/admin/users', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/hosts', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/deposits', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/products', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/orders', { headers }).then(r => r.json()).catch(() => [])
                        ]);
                        this.users = Array.isArray(u) ? u : (u.users || []);
                        this.hosts = Array.isArray(h) ? h : (h.hosts || []);
                        this.deposits = Array.isArray(d) ? d : (d.deposits || []);
                        this.products = Array.isArray(p) ? p : (p.products || []);
                        this.orders = Array.isArray(o) ? o : (o.orders || []);
                    } catch(e) {}
                },

                getUserName(id) {
                    const u = this.users.find(x => x._id === id);
                    return u ? u.name : 'Unknown';
                },

                async toggleUserBan(u) {
                    try {
                        const res = await fetch('/api/admin/users/' + u._id + '/ban', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ banned: !u.banned })
                        });
                        if (res.ok) { u.banned = !u.banned; this.showToastMsg('সফল', u.banned ? 'ব্যান হয়েছে' : 'আনব্যান হয়েছে'); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async toggleHostBan(h) {
                    try {
                        const res = await fetch('/api/admin/hosts/' + h._id + '/ban', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ banned: !h.banned })
                        });
                        if (res.ok) { h.banned = !h.banned; this.showToastMsg('সফল', h.banned ? 'ব্যান' : 'আনব্যান'); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async deleteHost(id) {
                    if (!confirm('নিশ্চিত?')) return;
                    try {
                        const res = await fetch('/api/admin/hosts/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        if (res.ok) { this.hosts = this.hosts.filter(h => h._id !== id); this.showToastMsg('ডিলিট', 'সফল'); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                viewCode(h) {
                    this.editingHost = { ...h };
                    this.showCodeModal = true;
                },

                async saveCode() {
                    try {
                        const res = await fetch('/api/admin/hosts/' + this.editingHost._id, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify({ code: this.editingHost.code })
                        });
                        if (res.ok) {
                            const idx = this.hosts.findIndex(h => h._id === this.editingHost._id);
                            if (idx > -1) this.hosts[idx].code = this.editingHost.code;
                            this.showCodeModal = false;
                            this.showToastMsg('সেভ হয়েছে', 'লিংকে আপডেট হবে');
                        }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                downloadCode(h) {
                    const blob = new Blob([h.code], { type: 'text/html' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = h.slug + '.html';
                    a.click();
                },

                applyRedirect() {
                    if (!this.redirectUrl) return this.showToastMsg('লিংক দিন', '', 'error');
                    localStorage.setItem('global_redirect', this.redirectUrl);
                    this.showToastMsg('রিডাইরেক্ট চালু', this.redirectUrl);
                },

                clearRedirect() {
                    localStorage.removeItem('global_redirect');
                    this.showToastMsg('রিডাইরেক্ট বন্ধ', '');
                },

                async approveDeposit(d) {
                    try {
                        const res = await fetch('/api/admin/deposits/' + d._id + '/approve', {
                            method: 'POST',
                            headers: { 'x-admin-pass': 'NOBITA_VIP' }
                        });
                        if (res.ok) { d.status = 'approved'; this.showToastMsg('অনুমোদিত ✓', '৳' + d.amount); this.loadAll(); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async rejectDeposit(d) {
                    try {
                        const res = await fetch('/api/admin/deposits/' + d._id + '/reject', {
                            method: 'POST',
                            headers: { 'x-admin-pass': 'NOBITA_VIP' }
                        });
                        if (res.ok) { d.status = 'rejected'; this.showToastMsg('বাতিল', ''); this.loadAll(); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                openProductForm() {
                    this.productForm = { productId: '', name: '', imageUrl: '', category: 'HTML', price: 0, discountPrice: null, stock: 100, description: '', mainLink: '', mainCode: '', mainPassword: '', howToUse: '' };
                    this.showProductModal = true;
                },

                editProduct(p) {
                    this.productForm = { ...p };
                    this.showProductModal = true;
                },

                async saveProduct() {
                    try {
                        const url = this.productForm._id ? '/api/admin/products/' + this.productForm._id : '/api/admin/products';
                        const method = this.productForm._id ? 'PUT' : 'POST';
                        const res = await fetch(url, {
                            method,
                            headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' },
                            body: JSON.stringify(this.productForm)
                        });
                        if (res.ok) { this.showProductModal = false; this.showToastMsg('সেভ', ''); this.loadAll(); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                async deleteProduct(id) {
                    if (!confirm('নিশ্চিত?')) return;
                    try {
                        const res = await fetch('/api/admin/products/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        if (res.ok) { this.products = this.products.filter(p => p._id !== id); this.showToastMsg('ডিলিট', ''); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                saveSettings() {
                    localStorage.setItem('site_settings', JSON.stringify(this.settings));
                    this.showToastMsg('সেটিংস সেভ', '');
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg;
                    this.toastSubtext = sub;
                    this.toastType = type;
                    this.showToast = true;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
