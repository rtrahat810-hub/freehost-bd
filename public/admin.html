<!DOCTYPE html>
<html lang="bn" x-data="adminApp()" x-init="init()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        body { background: #030712; color: #f3f4f6; min-height: 100vh; }
        .glass { background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.7); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-ghost { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.25s ease; }
        .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); }
        .premium-input { background: rgba(15, 23, 42, 0.8); border: 1.5px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: #fff; outline: none; transition: all 0.3s ease; }
        .premium-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
        .premium-input::placeholder { color: rgba(148, 163, 184, 0.5); }
        .stat-card { transition: all 0.35s ease; position: relative; overflow: hidden; }
        .stat-card:hover { transform: translateY(-4px); border-color: rgba(139, 92, 246, 0.3); }
        .table-row { transition: all 0.2s ease; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
        .table-row:hover { background: rgba(99, 102, 241, 0.06); }
        .badge { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.35s ease; }
        .empty-state { padding: 60px 20px; text-align: center; }
        .empty-state i { font-size: 48px; color: rgba(148, 163, 184, 0.2); margin-bottom: 16px; }
        .tab-btn { padding: 8px 16px; border-radius: 10px; font-size: 11px; font-weight: 800; transition: all 0.25s; border: 1px solid transparent; }
        .tab-btn.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
        .tab-btn:not(.active) { background: rgba(255,255,255,0.03); color: rgba(148, 163, 184, 0.8); border-color: rgba(255,255,255,0.06); }
        .sidebar-bg { background: linear-gradient(180deg, #0a0e1a 0%, #050811 100%); border-right: 1px solid rgba(255, 255, 255, 0.06); }
        .menu-item { transition: all 0.25s ease; border-radius: 10px; position: relative; overflow: hidden; }
        .menu-item:hover { background: rgba(99, 102, 241, 0.08); color: #fff; }
        .menu-item.active { background: linear-gradient(90deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.08)); color: #fff; box-shadow: inset 3px 0 0 #818cf8; }
        .group-label { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(148, 163, 184, 0.5); padding: 12px 12px 6px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <template x-if="!loggedIn">
        <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
            <div class="glass rounded-3xl p-8 max-w-md w-full relative z-10">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-indigo-500 via-purple-600 to-cyan-400 flex items-center justify-center shadow-2xl mb-5">
                        <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-black text-white mb-1">Admin Panel</h1>
                    <p class="text-[10px] text-indigo-300 mono tracking-widest">FREEHOST BD</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-300 mb-2 block">পাসওয়ার্ড</label>
                        <div class="relative">
                            <input :type="showPass ? 'text' : 'password'" x-model="password" @keyup.enter="login()" placeholder="Enter admin password" class="premium-input w-full px-4 py-3.5 text-sm pr-12">
                            <button @click="showPass = !showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                                <i :class="showPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" class="text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <button @click="login()" class="btn-primary w-full py-4 rounded-2xl font-black text-sm text-white">
                        <i class="fa-solid fa-unlock mr-2"></i> লগইন
                    </button>
                    <template x-if="loginError">
                        <div class="bg-red-500/20 border border-red-500/30 rounded-2xl p-3 text-center">
                            <p class="text-xs font-bold text-red-300" x-text="loginError"></p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template x-if="loggedIn">
        <div class="flex min-h-screen relative">
            <div x-show="mobileMenu" x-cloak @click="mobileMenu = false" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 lg:hidden"></div>

            <!-- SIDEBAR -->
            <aside :class="mobileMenu ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" class="fixed lg:sticky top-0 left-0 w-64 h-screen sidebar-bg z-50 lg:z-10 flex flex-col transition-transform duration-300 overflow-hidden">
                <div class="flex items-center gap-3 px-4 py-4 border-b border-white/5 flex-shrink-0">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-600 to-cyan-400 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-shield-halved text-white text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-black text-white truncate">FreeHost BD</div>
                        <div class="text-[9px] mono text-indigo-300 tracking-wider">ADMIN v3.0</div>
                    </div>
                    <button @click="mobileMenu = false" class="lg:hidden w-8 h-8 rounded-lg btn-ghost flex items-center justify-center">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                <nav class="flex-1 overflow-y-auto px-2 py-3">
                    <template x-for="group in menuGroups" :key="group.label">
                        <div class="mb-2">
                            <div class="group-label" x-text="group.label"></div>
                            <template x-for="item in group.items" :key="item.id">
                                <button @click="section = item.id; mobileMenu = false" :class="section === item.id ? 'active' : 'text-gray-400'" class="menu-item w-full text-left px-3 py-2.5 text-xs font-bold flex items-center gap-3 mb-0.5">
                                    <i :class="'fa-solid ' + item.icon" class="w-4 text-sm"></i>
                                    <span class="flex-1" x-text="item.label"></span>
                                    <template x-if="item.badge && item.badge() > 0">
                                        <span class="text-[9px] font-black px-1.5 py-0.5 rounded-full bg-amber-500 text-white" x-text="item.badge()"></span>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </template>
                </nav>

                <div class="p-3 border-t border-white/5 flex-shrink-0">
                    <button @click="logout()" class="w-full text-xs font-bold text-red-400 hover:text-red-300 px-3 py-2.5 rounded-xl hover:bg-red-500/10 flex items-center gap-3 transition">
                        <i class="fa-solid fa-right-from-bracket w-4"></i> লগআউট
                    </button>
                </div>
            </aside>

            <!-- MAIN -->
            <main class="flex-1 min-w-0 flex flex-col">
                <header class="sticky top-0 z-30 glass border-b border-white/5 px-4 lg:px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        <button @click="mobileMenu = true" class="lg:hidden w-10 h-10 rounded-xl btn-ghost flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-bars text-sm"></i>
                        </button>
                        <div class="min-w-0">
                            <h1 class="text-sm lg:text-base font-black text-white truncate" x-text="sectionTitle"></h1>
                            <p class="text-[10px] mono text-gray-500 truncate">Admin / <span x-text="sectionTitle"></span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button @click="refreshData()" class="w-9 h-9 rounded-xl btn-ghost flex items-center justify-center">
                            <i class="fa-solid fa-rotate text-xs" :class="loading ? 'fa-spin' : ''"></i>
                        </button>
                    </div>
                </header>

                <div class="flex-1 p-4 lg:p-6 overflow-x-hidden">

                    <!-- ===== DASHBOARD ===== -->
                    <template x-if="section === 'dashboard'">
                        <div class="fade-in space-y-5">
                            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-indigo-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-users text-indigo-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-indigo-300" x-text="users.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">ইউজার</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-cyan-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-cloud text-cyan-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-cyan-300" x-text="hosts.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">হোস্ট</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-amber-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-clock text-amber-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-amber-300" x-text="pendingDeposits"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">ডিপোজিট</div>
                                </div>
                                <div class="glass stat-card rounded-2xl p-5">
                                    <div class="w-9 h-9 rounded-xl bg-orange-500/20 flex items-center justify-center mb-3"><i class="fa-solid fa-bag-shopping text-orange-400 text-sm"></i></div>
                                    <div class="text-3xl font-black text-orange-300" x-text="orders.length"></div>
                                    <div class="text-[10px] text-gray-400 mt-1">অর্ডার</div>
                                </div>
                            </div>
                            <div class="glass rounded-2xl p-5">
                                <h3 class="font-black text-sm mb-3">📊 সার্ভার স্ট্যাটাস</h3>
                                <div class="grid sm:grid-cols-3 gap-3">
                                    <div class="bg-black/30 rounded-xl p-3"><div class="text-[10px] mono text-gray-400">UPTIME</div><div class="text-sm font-black text-emerald-400">99.9%</div></div>
                                    <div class="bg-black/30 rounded-xl p-3"><div class="text-[10px] mono text-gray-400">DATABASE</div><div class="text-sm font-black text-emerald-400">Connected</div></div>
                                    <div class="bg-black/30 rounded-xl p-3"><div class="text-[10px] mono text-gray-400">BANDWIDTH</div><div class="text-sm font-black text-cyan-400">Unlimited</div></div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ===== ALL USERS ===== -->
                    <template x-if="section === 'users'">
                        <div class="fade-in space-y-4">
                            <input type="text" x-model="userSearch" placeholder="🔍 নাম বা নাম্বার..." class="premium-input w-full px-4 py-3 text-sm">
                            <div class="glass rounded-2xl overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full">
                                        <thead class="bg-black/30">
                                            <tr>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase text-left">User</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase text-left">Phone</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase text-left">Balance</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase text-left">Status</th>
                                                <th class="px-4 py-3 text-[10px] mono font-bold text-gray-400 uppercase text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="u in filteredUsers" :key="u._id">
                                                <tr class="table-row">
                                                    <td class="px-4 py-3">
                                                        <div class="flex items-center gap-2">
                                                            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-[11px] font-black text-white" x-text="u.name.charAt(0).toUpperCase()"></div>
                                                            <span class="text-xs font-bold text-white" x-text="u.name"></span>
                                                        </div>
                                                    </td>
                                                    <td class="px-4 py-3 text-xs mono text-gray-300" x-text="u.phone"></td>
                                                    <td class="px-4 py-3 text-xs font-black text-emerald-400 mono">৳<span x-text="u.balance || 0"></span></td>
                                                    <td class="px-4 py-3"><span class="badge" :class="u.banned ? 'bg-red-500/20 text-red-300' : 'bg-emerald-500/20 text-emerald-300'" x-text="u.banned ? 'BANNED' : 'ACTIVE'"></span></td>
                                                    <td class="px-4 py-3 text-right">
                                                        <button @click="toggleUserBan(u)" :class="u.banned ? 'btn-success' : 'btn-warning'" class="px-3 py-1.5 rounded-lg text-[9px] font-black text-white">
                                                            <span x-text="u.banned ? 'UNBAN' : 'BAN'"></span>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- ===== BANNED USERS ===== -->
                    <template x-if="section === 'banned-users'">
                        <div class="fade-in space-y-2">
                            <template x-if="bannedUsers.length === 0">
                                <div class="glass rounded-2xl empty-state"><i class="fa-solid fa-user-check"></i><p class="text-sm text-gray-400">কোনো ব্যান করা ইউজার নেই</p></div>
                            </template>
                            <template x-for="u in bannedUsers" :key="u._id">
                                <div class="glass rounded-2xl p-4 flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-user-slash text-red-400 text-xs"></i></div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-white" x-text="u.name"></p>
                                        <p class="text-[10px] mono text-gray-400" x-text="u.phone"></p>
                                    </div>
                                    <button @click="toggleUserBan(u)" class="btn-success px-3 py-2 rounded-lg text-[10px] font-black text-white">UNBAN</button>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- ===== DEPOSIT REQUESTS ===== -->
                    <template x-if="section === 'deposit-requests'">
                        <div class="fade-in space-y-3">
                            <div class="flex gap-2 flex-wrap">
                                <button @click="depositFilter = 'pending'" :class="depositFilter === 'pending' ? 'tab-btn active' : 'tab-btn'">অপেক্ষমাণ <span x-text="pendingDeposits"></span></button>
                                <button @click="depositFilter = 'all'" :class="depositFilter === 'all' ? 'tab-btn active' : 'tab-btn'">সব</button>
                            </div>
                            <div class="space-y-2">
                                <template x-for="d in filteredDeposits" :key="d._id">
                                    <div class="glass rounded-2xl p-4">
                                        <div class="flex items-start gap-3 mb-3">
                                            <div class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" :class="d.status === 'approved' ? 'bg-emerald-500/20' : d.status === 'rejected' ? 'bg-red-500/20' : 'bg-amber-500/20'">
                                                <i class="fa-solid text-sm" :class="d.status === 'approved' ? 'fa-check text-emerald-400' : d.status === 'rejected' ? 'fa-xmark text-red-400' : 'fa-clock text-amber-400'"></i>
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <p class="text-lg font-black text-white">৳ <span x-text="d.amount"></span></p>
                                                <p class="text-[10px] mono text-gray-500">User: <span x-text="getUserName(d.userId)"></span></p>
                                                <p class="text-[10px] mono text-gray-500">From: <span class="text-indigo-300" x-text="d.senderNumber"></span></p>
                                                <p class="text-[10px] mono text-gray-500">TrxID: <span class="text-cyan-300" x-text="d.transactionId"></span></p>
                                            </div>
                                        </div>
                                        <template x-if="d.status === 'pending'">
                                            <div class="flex gap-2">
                                                <button @click="approveDeposit(d)" class="btn-success flex-1 py-2.5 rounded-xl text-xs font-black text-white">✓ APPROVE</button>
                                                <button @click="rejectDeposit(d)" class="btn-danger flex-1 py-2.5 rounded-xl text-xs font-black text-white">✗ REJECT</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- ===== ALL HOSTS ===== -->
                    <template x-if="section === 'hosts'">
                        <div class="fade-in space-y-3">
                            <input type="text" x-model="hostSearch" placeholder="🔍 হোস্ট লিংক সার্চ..." class="premium-input w-full px-4 py-3 text-sm">
                            <div class="space-y-2">
                                <template x-for="h in filteredHosts" :key="h._id">
                                    <div class="glass rounded-2xl p-4">
                                        <div class="flex items-start gap-3">
                                            <div class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center flex-shrink-0"><i class="fa-brands fa-html5 text-cyan-400"></i></div>
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <p class="text-sm font-bold text-white truncate" x-text="h.title"></p>
                                                    <span x-show="h.banned" class="badge bg-red-500/20 text-red-300">BANNED</span>
                                                </div>
                                                <p class="text-[10px] mono text-indigo-300 truncate mt-0.5" x-text="'/s/' + h.slug"></p>
                                                <p class="text-[10px] text-gray-500 mono mt-1">👁 <span x-text="h.views || 0"></span> views</p>
                                            </div>
                                        </div>
                                        <div class="flex gap-1.5 mt-3 flex-wrap">
                                            <button @click="viewCode(h)" class="btn-primary px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-code"></i> কোড</button>
                                            <a :href="'/s/' + h.slug" target="_blank" class="btn-ghost px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-external-link"></i> ওপেন</a>
                                            <button @click="downloadCode(h)" class="btn-ghost px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-download"></i> ডাউনলোড</button>
                                            <button @click="toggleHostBan(h)" :class="h.banned ? 'btn-success' : 'btn-warning'" class="px-3 py-2 rounded-lg text-[10px] font-black text-white"><span x-text="h.banned ? 'UNBAN' : 'BAN'"></span></button>
                                            <button @click="deleteHost(h._id)" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- ===== BANNED HOSTS ===== -->
                    <template x-if="section === 'banned-hosts'">
                        <div class="fade-in space-y-2">
                            <template x-if="bannedHosts.length === 0">
                                <div class="glass rounded-2xl empty-state"><i class="fa-solid fa-shield-halved"></i><p class="text-sm text-gray-400">কোনো ব্যান করা হোস্ট নেই</p></div>
                            </template>
                            <template x-for="h in bannedHosts" :key="h._id">
                                <div class="glass rounded-2xl p-4 flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-red-500/20 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-ban text-red-400"></i></div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-bold text-white truncate" x-text="h.title"></p>
                                        <p class="text-[10px] mono text-red-300 truncate" x-text="'/s/' + h.slug"></p>
                                    </div>
                                    <button @click="toggleHostBan(h)" class="btn-success px-3 py-2 rounded-lg text-[10px] font-black text-white">UNBAN</button>
                                    <button @click="deleteHost(h._id)" class="btn-danger px-3 py-2 rounded-lg text-[10px] font-black text-white"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- ===== GLOBAL REDIRECT ===== -->
                    <template x-if="section === 'redirect'">
                        <div class="fade-in max-w-2xl">
                            <div class="glass rounded-2xl p-6">
                                <h3 class="font-black text-lg mb-4">🔀 Global Redirect</h3>
                                <p class="text-xs text-gray-400 mb-4">সব হোস্ট করা লিংক এই URL-এ রিডাইরেক্ট হবে।</p>
                                <div class="space-y-3">

    <!-- TOAST -->
    <div x-show="showToast" x-cloak class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] glass px-5 py-3 rounded-2xl flex items-center gap-3 max-w-sm shadow-2xl">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" :class="toastType === 'error' ? 'bg-red-500' : 'bg-emerald-500'"><i class="fa-solid text-sm text-white" :class="toastType === 'error' ? 'fa-xmark' : 'fa-check'"></i></div>
        <div class="min-w-0"><p class="text-xs font-bold text-white" x-text="toastMessage"></p><p class="text-[10px] text-gray-400 truncate" x-text="toastSubtext"></p></div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        function adminApp() {
            return {
                loggedIn: false, password: '', showPass: false, loginError: '',
                section: 'dashboard', mobileMenu: false, loading: false,
                users: [], hosts: [], deposits: [], products: [], orders: [],
                userSearch: '', hostSearch: '', depositFilter: 'pending',
                redirectUrl: '', redirectActive: '',
                showCodeModal: false, editingHost: null,
                showProductModal: false, productForm: {},
                manualBalance: { userId: '', amount: '', note: '' },
                passwordForm: { old: '', new: '', confirm: '' },
                activityLogs: [],
                settings: {
                    bkashNumber: '01XXXXXXXXX', nagadNumber: '01XXXXXXXXX',
                    siteName: 'FreeHost BD', tagline: 'Premium Cloud', footerText: 'PREMIUM PROJECT',
                    htmlHostTitle: 'FreeHost BD', htmlHostSubtitle: 'Deploy HTML instantly',
                    shopTitle: 'CodeShop', shopAnnouncement: 'Promo offer!',
                    primaryColor: '#6366f1', accentColor: '#8b5cf6'
                },
                showToast: false, toastMessage: '', toastSubtext: '', toastType: 'success',

                menuGroups: [
                    { label: '📊 Main', items: [{ id: 'dashboard', label: 'ড্যাশবোর্ড', icon: 'fa-chart-line' }] },
                    { label: '👥 Users', items: [
                        { id: 'users', label: 'All Users', icon: 'fa-users' },
                        { id: 'banned-users', label: 'Banned Users', icon: 'fa-user-slash' },
                        { id: 'deposit-requests', label: 'Deposit Requests', icon: 'fa-money-bill-transfer', badge: () => this.pendingDeposits }
                    ]},
                    { label: '🌐 Hosting', items: [
                        { id: 'hosts', label: 'All Hosts', icon: 'fa-cloud' },
                        { id: 'banned-hosts', label: 'Banned Hosts', icon: 'fa-ban' },
                        { id: 'redirect', label: 'Global Redirect', icon: 'fa-arrow-right-arrow-left' },
                        { id: 'analytics', label: 'Analytics', icon: 'fa-chart-simple' }
                    ]},
                    { label: '🛒 Shop', items: [
                        { id: 'products', label: 'Products', icon: 'fa-box' },
                        { id: 'orders', label: 'Orders', icon: 'fa-bag-shopping' }
                    ]},
                    { label: '💰 Finance', items: [
                        { id: 'transactions', label: 'Transactions', icon: 'fa-receipt' },
                        { id: 'manual-balance', label: 'Manual Balance', icon: 'fa-hand-holding-dollar' }
                    ]},
                    { label: '⚙️ Settings', items: [
                        { id: 'payment-numbers', label: 'Payment Numbers', icon: 'fa-mobile-screen-button' },
                        { id: 'branding', label: 'Site Branding', icon: 'fa-palette' },
                        { id: 'page-texts', label: 'Page Texts', icon: 'fa-file-lines' },
                        { id: 'theme', label: 'Colors & Theme', icon: 'fa-paintbrush' }
                    ]},
                    { label: '🔐 Admin', items: [
                        { id: 'change-password', label: 'Change Password', icon: 'fa-key' },
                        { id: 'activity-log', label: 'Activity Log', icon: 'fa-list' },
                        { id: 'backup', label: 'Backup', icon: 'fa-database' }
                    ]}
                ],

                get sectionTitle() {
                    for (const g of this.menuGroups) { const m = g.items.find(i => i.id === this.section); if (m) return m.label; }
                    return 'Dashboard';
                },
                get pendingDeposits() { return this.deposits.filter(d => d.status === 'pending').length; },
                get approvedDeposits() { return this.deposits.filter(d => d.status === 'approved'); },
                get bannedUsers() { return this.users.filter(u => u.banned); },
                get bannedHosts() { return this.hosts.filter(h => h.banned); },
                get totalIn() { return this.approvedDeposits.reduce((s, d) => s + (d.amount || 0), 0); },
                get totalViews() { return this.hosts.reduce((s, h) => s + (h.views || 0), 0); },
                get avgViews() { return this.hosts.length ? Math.round(this.totalViews / this.hosts.length) : 0; },
                get topSite() { const s = [...this.hosts].sort((a, b) => (b.views || 0) - (a.views || 0))[0]; return s ? s.title : '—'; },
                get topSites() { return [...this.hosts].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10); },
                get filteredUsers() { const q = this.userSearch.toLowerCase(); return !q ? this.users : this.users.filter(u => u.name.toLowerCase().includes(q) || u.phone.includes(q)); },
                get filteredHosts() { const q = this.hostSearch.toLowerCase(); return !q ? this.hosts : this.hosts.filter(h => h.title.toLowerCase().includes(q) || h.slug.toLowerCase().includes(q)); },
                get filteredDeposits() { return this.depositFilter === 'all' ? this.deposits : this.deposits.filter(d => d.status === 'pending'); },

                init() {
                    const saved = localStorage.getItem('admin_logged_in');
                    if (saved === 'true') { this.loggedIn = true; this.loadAll(); }
                    this.redirectActive = localStorage.getItem('global_redirect') || '';
                    this.loadServerSettings();
                },

                async loadServerSettings() {
                    try {
                        const res = await fetch('/api/setting/all', { headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                        if (res.ok) { const data = await res.json(); Object.assign(this.settings, data); }
                    } catch(e) {}
                },

                login() {
                    this.loginError = '';
                    if (this.password === 'NOBITA_VIP') {
                        this.loggedIn = true;
                        localStorage.setItem('admin_logged_in', 'true');
                        this.addLog('Admin logged in');
                        this.loadAll();
                    } else { this.loginError = 'ভুল পাসওয়ার্ড'; }
                },

                logout() { this.loggedIn = false; localStorage.removeItem('admin_logged_in'); this.password = ''; },

                async loadAll() {
                    this.loading = true;
                    const headers = { 'x-admin-pass': 'NOBITA_VIP' };
                    try {
                        const [u, h, d, p, o] = await Promise.all([
                            fetch('/api/admin/users', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/hosts', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/deposits', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/products', { headers }).then(r => r.json()).catch(() => []),
                            fetch('/api/admin/orders', { headers }).then(r => r.json()).catch(() => [])
                        ]);
                        this.users = Array.isArray(u) ? u : [];
                        this.hosts = Array.isArray(h) ? h : [];
                        this.deposits = Array.isArray(d) ? d : [];
                        this.products = Array.isArray(p) ? p : [];
                        this.orders = Array.isArray(o) ? o : [];
                    } catch(e) {}
                    this.loading = false;
                },

                refreshData() { this.loadAll(); this.showToastMsg('রিফ্রেশ', 'ডেটা লোড'); },
                getUserName(id) { const u = this.users.find(x => x._id === id); return u ? u.name : 'Unknown'; },
                addLog(action) { this.activityLogs.unshift({ action, time: new Date().toLocaleString('en-GB') }); if (this.activityLogs.length > 100) this.activityLogs = this.activityLogs.slice(0, 100); },
                clearLogs() { if (!confirm('সব লগ মুছবেন?')) return; this.activityLogs = []; this.showToastMsg('ক্লিয়ার', 'লগ মুছে'); },

                async toggleUserBan(u) {
                    const res = await fetch('/api/admin/users/' + u._id + '/ban', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ banned: !u.banned }) });
                    if (res.ok) { u.banned = !u.banned; this.addLog((u.banned ? 'Banned: ' : 'Unbanned: ') + u.name); this.showToastMsg('সফল', u.banned ? 'ব্যান' : 'আনব্যান'); }
                },
                async toggleHostBan(h) {
                    const res = await fetch('/api/admin/hosts/' + h._id + '/ban', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ banned: !h.banned }) });
                    if (res.ok) { h.banned = !h.banned; this.showToastMsg('সফল', h.banned ? 'ব্যান' : 'আনব্যান'); }
                },
                async deleteHost(id) {
                    if (!confirm('নিশ্চিত?')) return;
                    const res = await fetch('/api/admin/hosts/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    if (res.ok) { this.hosts = this.hosts.filter(h => h._id !== id); this.showToastMsg('ডিলিট', ''); }
                },
                viewCode(h) { this.editingHost = { ...h }; this.showCodeModal = true; },
                async saveCode() {
                    const res = await fetch('/api/admin/hosts/' + this.editingHost._id, { method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ code: this.editingHost.code }) });
                    if (res.ok) { const idx = this.hosts.findIndex(h => h._id === this.editingHost._id); if (idx > -1) this.hosts[idx].code = this.editingHost.code; this.showCodeModal = false; this.showToastMsg('সেভ', 'আপডেট'); }
                },
                downloadCode(h) { const blob = new Blob([h.code], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = h.slug + '.html'; a.click(); },
                applyRedirect() { if (!this.redirectUrl) return this.showToastMsg('লিংক দিন', '', 'error'); localStorage.setItem('global_redirect', this.redirectUrl); this.redirectActive = this.redirectUrl; this.showToastMsg('চালু', this.redirectUrl); },
                clearRedirect() { localStorage.removeItem('global_redirect'); this.redirectActive = ''; this.showToastMsg('বন্ধ', ''); },

                async approveDeposit(d) {
                    const res = await fetch('/api/admin/deposits/' + d._id + '/approve', { method: 'POST', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    if (res.ok) { d.status = 'approved'; this.addLog('Approved: ৳' + d.amount); this.showToastMsg('অনুমোদিত ✓', '৳' + d.amount); this.loadAll(); }
                },
                async rejectDeposit(d) {
                    if (!confirm('বাতিল?')) return;
                    const res = await fetch('/api/admin/deposits/' + d._id + '/reject', { method: 'POST', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    if (res.ok) { d.status = 'rejected'; this.showToastMsg('বাতিল', ''); this.loadAll(); }
                },

                openProductForm() { this.productForm = { productId: '', name: '', imageUrl: '', category: 'HTML', price: 0, discountPrice: null, stock: 100, description: '', mainLink: '', mainCode: '', mainPassword: '', howToUse: '' }; this.showProductModal = true; },
                editProduct(p) { this.productForm = { ...p }; this.showProductModal = true; },
                async saveProduct() {
                    const url = this.productForm._id ? '/api/admin/products/' + this.productForm._id : '/api/admin/products';
                    const method = this.productForm._id ? 'PUT' : 'POST';
                    const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify(this.productForm) });
                    if (res.ok) { this.showProductModal = false; this.showToastMsg('সেভ', ''); this.loadAll(); }
                },
                async deleteProduct(id) {
                    if (!confirm('নিশ্চিত?')) return;
                    const res = await fetch('/api/admin/products/' + id, { method: 'DELETE', headers: { 'x-admin-pass': 'NOBITA_VIP' } });
                    if (res.ok) { this.products = this.products.filter(p => p._id !== id); this.showToastMsg('ডিলিট', ''); }
                },

                async addManualBalance() {
                    if (!this.manualBalance.userId || !this.manualBalance.amount) return this.showToastMsg('সব ফিল্ড দিন', '', 'error');
                    const res = await fetch('/api/admin/users/' + this.manualBalance.userId + '/balance', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify({ amount: Number(this.manualBalance.amount), note: this.manualBalance.note }) });
                    if (res.ok) { this.showToastMsg('যোগ ✓', '৳' + this.manualBalance.amount); this.manualBalance = { userId: '', amount: '', note: '' }; this.loadAll(); }
                },

                async saveSettings() {
                    try {
                        const res = await fetch('/api/setting/update', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pass': 'NOBITA_VIP' }, body: JSON.stringify(this.settings) });
                        if (res.ok) { this.addLog('Settings saved'); this.showToastMsg('সেভ ✓', 'সব পেজে আপডেট'); }
                    } catch(e) { this.showToastMsg('ব্যর্থ', e.message, 'error'); }
                },

                changePassword() {
                    if (!this.passwordForm.old || !this.passwordForm.new) return this.showToastMsg('সব ফিল্ড দিন', '', 'error');
                    if (this.passwordForm.new !== this.passwordForm.confirm) return this.showToastMsg('পাসওয়ার্ড মিলছে না', '', 'error');
                    if (this.passwordForm.old !== 'NOBITA_VIP') return this.showToastMsg('পুরনো পাসওয়ার্ড ভুল', '', 'error');
                    this.addLog('Password changed'); this.passwordForm = { old: '', new: '', confirm: '' };
                    this.showToastMsg('সফল', 'শুধু local');
                },

                downloadBackup() {
                    const data = { users: this.users, hosts: this.hosts.map(h => ({ ...h, code: h.code ? '[TRUNCATED]' : '' })), deposits: this.deposits, products: this.products, orders: this.orders, settings: this.settings, exportedAt: new Date().toISOString() };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'freehostbd-backup-' + Date.now() + '.json'; a.click();
                },

                exportAllCodes() {
                    this.hosts.forEach(h => { const blob = new Blob([h.code], { type: 'text/html' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = h.slug + '.html'; a.click(); });
                    this.showToastMsg('ডাউনলোড', this.hosts.length + ' ফাইল');
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg; this.toastSubtext = sub; this.toastType = type; this.showToast = true;
                    clearTimeout(this._t); this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
