<!DOCTYPE html>
<html lang="bn" x-data="shopApp()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShop — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        .code-preview {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            line-height: 1.5;
            padding: 12px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .code-preview .dots {
            position: absolute;
            top: 7px; left: 10px;
            display: flex;
            gap: 4px;
            z-index: 2;
        }
        .code-preview .dots span {
            width: 8px; height: 8px;
            border-radius: 50%;
        }
        .code-preview .dots span:nth-child(1) { background: #ff5f56; }
        .code-preview .dots span:nth-child(2) { background: #ffbd2e; }
        .code-preview .dots span:nth-child(3) { background: #27c93f; }
        .code-preview pre {
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .tag { color: #ff7b72; }
        .attr { color: #79c0ff; }
        .str { color: #a5d6ff; }
        .comment { color: #8b949e; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }
        
        .grid-bg {
            background-image: 
                linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased pb-20 md:pb-0">

    <!-- ANNOUNCEMENT BAR -->
    <div class="bg-gradient-to-r from-orange-600 via-amber-600 to-orange-600 text-white text-[11px] sm:text-xs py-2 px-3 text-center font-medium relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent animate-pulse"></div>
        <p class="relative z-10">🎉 প্রমোশনাল অফার! প্রথম অর্ডারে পাবেন <span class="font-bold underline">১০% ক্যাশব্যাক</span> (কুপন: CODE10)</p>
    </div>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20 gap-3">
                
                <a href="/" class="flex items-center gap-2.5 group flex-shrink-0">
                    <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white text-lg sm:text-xl font-black shadow-lg shadow-orange-600/40 group-hover:scale-105 transition">
                        <i class="fa-solid fa-code"></i>
                    </div>
                    <div class="leading-none hidden sm:block">
                        <span class="text-lg sm:text-2xl font-black tracking-tight text-gray-900 block">Code<span class="text-orange-600">Shop</span></span>
                        <span class="text-[9px] sm:text-[10px] text-gray-400 font-semibold tracking-wider">BY FREEHOST BD</span>
                    </div>
                </a>

                <div class="hidden md:flex items-center gap-1">
                    <button @click="view = 'home'" 
                       :class="view === 'home' ? 'bg-orange-50 text-orange-600' : 'text-gray-600 hover:bg-gray-50 hover:text-orange-600'"
                       class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                        <i class="fa-solid fa-house text-xs"></i> হোম
                    </button>
                    <button @click="view = 'wishlist'" 
                       :class="view === 'wishlist' ? 'bg-orange-50 text-orange-600' : 'text-gray-600 hover:bg-gray-50 hover:text-orange-600'"
                       class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 relative">
                        <i class="fa-regular fa-heart text-xs"></i> উইশলিস্ট
                        <span x-show="wishlist.length > 0" x-text="wishlist.length" x-cloak class="bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center"></span>
                    </button>
                    <a href="/account" class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 text-gray-600 hover:bg-gray-50 hover:text-orange-600">
                        <i class="fa-regular fa-user text-xs"></i> একাউন্ট
                    </a>
                    <a href="/" class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 text-gray-600 hover:bg-gray-50 hover:text-indigo-600">
                        <i class="fa-solid fa-cloud text-xs"></i> হোস্টিং
                    </a>
                </div>

                <div class="flex-1 max-w-sm relative hidden md:block">
                    <input type="text" x-model="searchQuery" placeholder="কোড খুঁজুন..." class="w-full bg-gray-100/80 border-0 rounded-2xl py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                </div>

                <button @click="view = 'deposit'" class="bg-gradient-to-r from-emerald-500 to-teal-500 text-white px-3 sm:px-5 py-2 sm:py-2.5 rounded-2xl text-xs sm:text-sm font-bold shadow-lg shadow-emerald-500/30 hover:scale-105 transition flex items-center gap-2">
                    <i class="fa-solid fa-wallet text-xs"></i>
                    <span class="hidden sm:inline">ডিপোজিট</span>
                </button>
            </div>
            
            <div class="md:hidden pb-3 relative">
                <input type="text" x-model="searchQuery" placeholder="কোড খুঁজুন..." class="w-full bg-gray-100/80 border-0 rounded-xl py-2 pl-9 pr-3 text-xs focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
            </div>
        </div>
    </nav>

    <!-- HOME VIEW -->
    <template x-if="view === 'home'">
        <div>
            <!-- HERO -->
            <section class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-4 sm:pt-6">
                <div class="relative rounded-3xl overflow-hidden bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-[180px] sm:min-h-[280px] flex items-center p-5 sm:p-10 shadow-2xl grid-bg">
                    <div class="absolute top-6 right-6 hidden md:block float-anim">
                        <div class="code-preview w-56 opacity-80" style="transform: rotate(3deg);">
                            <div class="dots"><span></span><span></span><span></span></div>
                            <pre><span class="tag">&lt;div</span> <span class="attr">class</span>=<span class="str">"card"</span><span class="tag">&gt;</span>
  <span class="tag">&lt;h1&gt;</span>Hello<span class="tag">&lt;/h1&gt;</span>
<span class="tag">&lt;/div&gt;</span></pre>
                        </div>
                    </div>

                    <div class="relative z-10 max-w-lg">
                        <span class="inline-flex items-center gap-1.5 bg-orange-500/20 text-orange-400 text-[10px] sm:text-xs font-bold px-3 py-1 rounded-full mb-3 border border-orange-500/30 backdrop-blur">
                            <i class="fa-solid fa-bolt text-[8px]"></i>
                            প্রিমিয়াম কোড কালেকশন
                        </span>
                        <h1 class="text-xl sm:text-4xl font-black text-white leading-tight mb-2">
                            কপি-পেস্ট রেডি<br>
                            <span class="bg-gradient-to-r from-orange-400 to-amber-400 bg-clip-text text-transparent">কোড স্নিপেট</span>
                        </h1>
                        <p class="text-gray-300 text-xs sm:text-sm mb-4 max-w-md">HTML, Python ও JavaScript এর রেডি-টু-ইউজ কোড।</p>
                        
                        <div class="flex items-center gap-3 sm:gap-6 text-white">
                            <div>
                                <div class="text-lg sm:text-2xl font-black text-orange-400" x-text="products.length + '+'"></div>
                                <div class="text-[10px] text-gray-400 font-medium">স্নিপেট</div>
                            </div>
                            <div class="w-px h-8 bg-white/20"></div>
                            <div>
                                <div class="text-lg sm:text-2xl font-black text-orange-400">১০কে+</div>
                                <div class="text-[10px] text-gray-400 font-medium">ডাউনলোড</div>
                            </div>
                            <div class="w-px h-8 bg-white/20"></div>
                            <div>
                                <div class="text-lg sm:text-2xl font-black text-orange-400">৪.৯★</div>
                                <div class="text-[10px] text-gray-400 font-medium">রেটিং</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CATEGORIES -->
            <section class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6">
                <div class="flex gap-2 sm:gap-3 overflow-x-auto pb-2 scrollbar-none">
                    <template x-for="cat in categories" :key="cat.name">
                        <button @click="selectedCategory = cat.name" 
                                :class="selectedCategory === cat.name ? 'bg-gradient-to-r from-orange-600 to-amber-600 text-white shadow-lg shadow-orange-600/30 border-transparent' : 'bg-white text-gray-700 border-gray-100 hover:border-orange-200'"
                                class="flex items-center gap-2 px-4 py-2.5 rounded-2xl font-bold text-xs whitespace-nowrap border transition-all">
                            <span x-text="cat.icon"></span>
                            <span x-text="cat.name"></span>
                        </button>
                    </template>
                </div>
            </section>

            <!-- PRODUCTS GRID -->
            <section class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2 sm:py-4">
                <div class="flex items-center justify-between mb-5">
                    <div>
                        <h2 class="text-lg sm:text-2xl font-extrabold text-gray-900">জনপ্রিয় কোড স্নিপেট</h2>
                        <p class="text-[11px] sm:text-xs text-gray-500 mt-0.5">রেডি-টু-ইউজ কোড</p>
                    </div>
                    <span class="text-[10px] sm:text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-full" x-text="filteredProducts.length + ' টি'"></span>
                </div>

                <div class="grid grid-cols-2 gap-3 sm:gap-5">
                    <template x-for="product in filteredProducts" :key="product.id">
                        <div @click="openProduct(product)" class="bg-white rounded-2xl sm:rounded-3xl border border-gray-100 p-2.5 sm:p-4 hover:shadow-2xl hover:shadow-orange-100/50 hover:-translate-y-1 transition-all flex flex-col justify-between relative group overflow-hidden cursor-pointer">
                            
                            <span x-show="product.discount" x-text="'-' + product.discount + '%'" class="absolute top-4 left-4 z-20 bg-gradient-to-r from-red-500 to-pink-500 text-white text-[9px] sm:text-[10px] font-black px-2 py-0.5 rounded-full shadow-lg shadow-red-500/30"></span>

                            <div>
                                <div class="relative aspect-[4/3] rounded-xl sm:rounded-2xl overflow-hidden mb-2.5 sm:mb-3 bg-slate-900 group-hover:shadow-xl transition">
                                    <div class="code-preview h-full w-full !rounded-xl sm:!rounded-2xl !p-2 sm:!p-3" style="background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);">
                                        <div class="dots"><span></span><span></span><span></span></div>
                                        <pre class="mt-5 sm:mt-6 text-[8px] sm:text-[10px] leading-relaxed" x-html="product.preview"></pre>
                                    </div>
                                </div>

                                <div class="flex items-center gap-1.5 mb-1">
                                    <span class="text-[9px] sm:text-[10px] text-orange-600 font-bold bg-orange-50 px-1.5 sm:px-2 py-0.5 rounded-md" x-text="product.category"></span>
                                </div>
                                
                                <h3 class="font-bold text-gray-900 text-[11px] sm:text-sm mb-1 line-clamp-1 leading-tight code-font" x-text="product.name"></h3>
                                
                                <p class="text-[10px] sm:text-[11px] text-gray-500 line-clamp-2 mb-2 hidden sm:block" x-text="product.description"></p>
                            </div>

                            <div class="pt-2 sm:pt-3 border-t border-dashed border-gray-100 flex items-center justify-between gap-1.5">
                                <div class="min-w-0">
                                    <div class="text-[9px] sm:text-[10px] text-gray-400 line-through" x-show="product.discountPrice" x-text="'৳' + product.price"></div>
                                    <div class="text-sm sm:text-lg font-black text-gray-900 leading-tight">
                                        <span x-text="'৳' + (product.discountPrice || product.price)"></span>
                                    </div>
                                </div>
                                <button @click.stop="toggleWishlist(product)" 
                                        :class="isWishlisted(product._id) ? 'bg-red-500 text-white' : 'bg-gradient-to-r from-gray-900 to-gray-800 hover:from-orange-600 hover:to-amber-600 text-white'"
                                        class="p-2 sm:p-2.5 rounded-lg sm:rounded-xl transition shadow-lg hover:shadow-orange-500/30 flex-shrink-0">
                                    <i :class="isWishlisted(product._id) ? 'fa-solid fa-heart' : 'fa-regular fa-heart'" class="text-[10px] sm:text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="filteredProducts.length === 0">
                    <div class="text-center py-16">
                        <div class="w-20 h-20 rounded-3xl bg-gray-100 flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-magnifying-glass text-2xl text-gray-300"></i>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1">কোনো স্নিপেট পাওয়া যায়নি</h3>
                        <p class="text-xs text-gray-500">অন্য কিছু খুঁজে দেখুন</p>
                    </div>
                </template>
            </section>
        </div>
    </template>

    <!-- WISHLIST VIEW -->
    <template x-if="view === 'wishlist'">
        <section class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-8">
            <h2 class="text-2xl font-black text-gray-900 mb-6">❤️ আমার উইশলিস্ট</h2>
            
            <template x-if="wishlistProducts.length === 0">
                <div class="text-center py-16 bg-white rounded-3xl border border-gray-100">
                    <div class="w-20 h-20 rounded-3xl bg-red-50 flex items-center justify-center mx-auto mb-4">
                        <i class="fa-regular fa-heart text-2xl text-red-300"></i>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-1">উইশলিস্ট খালি</h3>
                    <p class="text-xs text-gray-500 mb-4">পছন্দের কোড সেভ করুন</p>
                    <button @click="view = 'home'" class="bg-orange-600 text-white px-6 py-3 rounded-xl text-sm font-bold">শপে ফিরে যান</button>
                </div>
            </template>

            <div class="grid grid-cols-2 gap-3 sm:gap-5">
                <template x-for="product in wishlistProducts" :key="product._id">
                    <div @click="openProduct(product)" class="bg-white rounded-2xl sm:rounded-3xl border border-gray-100 p-2.5 sm:p-4 hover:shadow-2xl transition-all cursor-pointer">
                        <div class="aspect-[4/3] rounded-xl overflow-hidden mb-2.5 bg-slate-900">
                            <div class="code-preview h-full w-full !p-3">
                                <div class="dots"><span></span><span></span><span></span></div>
                                <pre class="mt-6 text-[9px]" x-html="product.preview"></pre>
                            </div>
                        </div>
                        <h3 class="font-bold text-sm mb-1 line-clamp-1 code-font" x-text="product.name"></h3>
                        <div class="flex items-center justify-between">
                            <span class="font-black text-lg" x-text="'৳' + (product.discountPrice || product.price)"></span>
                            <button @click.stop="toggleWishlist(product)" class="text-red-500">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </template>

    <!-- DEPOSIT VIEW -->
    <template x-if="view === 'deposit'">
        <section class="max-w-2xl mx-auto px-3 sm:px-6 py-8">
            <div class="bg-white rounded-3xl border border-gray-100 p-6 sm:p-8 shadow-xl">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-wallet text-white text-xl"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-black">ডিপোজিট করুন</h2>
                        <p class="text-xs text-gray-500">সর্বনিম্ন ৫০৳ — সর্বোচ্চ ২৫০০৳</p>
                    </div>
                </div>

                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 mb-5">
                    <p class="text-xs font-bold text-emerald-700 mb-1">💚 বিকাশ নাম্বার:</p>
                    <p class="text-lg font-black text-emerald-900">01XXXXXXXXX</p>
                    <p class="text-[10px] text-emerald-600 mt-1">টাকা পাঠিয়ে নিচের ফর্ম পূরণ করুন</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-2 block">পরিমাণ (৳)</label>
                        <input type="number" x-model="depositForm.amount" min="50" max="2500" placeholder="500" class="w-full border border-gray-200 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-2 block">আপনার নাম্বার</label>
                        <input type="text" x-model="depositForm.senderNumber" placeholder="01XXXXXXXXX" class="w-full border border-gray-200 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-2 block">ট্রানজেকশন আইডি</label>
                        <input type="text" x-model="depositForm.transactionId" placeholder="TrxID" class="w-full border border-gray-200 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-700 mb-2 block">মেথড</label>
                        <select x-model="depositForm.method" class="w-full border border-gray-200 rounded-xl py-3 px-4 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="bKash">বিকাশ</option>
                            <option value="Nagad">নগদ</option>
                        </select>
                    </div>

                    <button @click="submitDeposit()" :disabled="depositing" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-4 rounded-2xl font-black text-sm shadow-xl hover:scale-[1.02] transition disabled:opacity-50">
                        <span x-show="!depositing">🚀 রিকোয়েস্ট পাঠান</span>
                        <span x-show="depositing">⏳ পাঠানো হচ্ছে...</span>
                    </button>
                </div>
            </div>
        </section>
    </template>

    <!-- PRODUCT MODAL -->
    <div x-show="selectedProduct" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-3 modal-backdrop" @click.self="selectedProduct = null">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
            <template x-if="selectedProduct">
                <div>
                    <div class="relative p-6 border-b border-gray-100">
                        <button @click="selectedProduct = null" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <span class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1 rounded-full" x-text="selectedProduct.category"></span>
                        <h2 class="text-xl font-black mt-2 code-font" x-text="selectedProduct.name"></h2>
                    </div>

                    <div class="p-6">
                        <div class="aspect-video rounded-2xl overflow-hidden mb-4 bg-slate-900">
                            <div class="code-preview h-full w-full !p-4">
                                <div class="dots"><span></span><span></span><span></span></div>
                                <pre class="mt-6 text-xs" x-html="selectedProduct.preview"></pre>
                            </div>
                        </div>

                        <p class="text-sm text-gray-600 mb-4" x-text="selectedProduct.description"></p>

                        <div class="flex items-center justify-between p-4 bg-orange-50 rounded-2xl mb-4">
                            <div>
                                <p class="text-xs text-gray-500">মূল্য</p>
                                <p class="text-2xl font-black text-orange-600" x-text="'৳' + (selectedProduct.discountPrice || selectedProduct.price)"></p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs text-gray-500">স্টক</p>
                                <p class="font-bold" x-text="selectedProduct.stock + ' টি'"></p>
                            </div>
                        </div>

                        <button @click="buyProduct(selectedProduct)" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white py-4 rounded-2xl font-black shadow-xl hover:scale-[1.02] transition">
                            🛒 এখনই কিনুন
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- TOAST -->
    <div x-show="showToast" x-cloak
         x-transition:enter="transform transition ease-out duration-300"
         x-transition:enter-start="translate-y-20 opacity-0"
         x-transition:enter-end="translate-y-0 opacity-100"
         class="fixed bottom-24 md:bottom-8 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 max-w-sm">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-check text-sm"></i>
        </div>
        <div class="min-w-0">
            <p class="text-xs font-bold" x-text="toastMessage"></p>
            <p class="text-[10px] text-gray-400 truncate" x-text="toastSubtext"></p>
        </div>
    </div>

    <script>
        function shopApp() {
            return {
                view: 'home',
                searchQuery: '',
                selectedCategory: 'ALL',
                wishlist: [],
                showToast: false,
                toastMessage: '',
                toastSubtext: '',
                selectedProduct: null,
                depositing: false,
                depositForm: { amount: '', senderNumber: '', transactionId: '', method: 'bKash' },

                categories: [
                    { name: 'ALL', icon: '🛍️' },
                    { name: 'HTML', icon: '🌐' },
                    { name: 'PYTHON', icon: '🐍' },
                    { name: 'JAVASCRIPT', icon: '⚡' }
                ],

                products: [
                    { _id: 'demo1', name: '<div class="card">', category: 'HTML', price: 0, discountPrice: null, discount: 100, description: 'রেসপন্সিভ কার্ড কম্পোনেন্ট', stock: 100, preview: '<span class="tag">&lt;div</span> <span class="attr">class</span>=<span class="str">"card"</span><span class="tag">&gt;</span><br>  <span class="tag">&lt;h3&gt;</span>Title<span class="tag">&lt;/h3&gt;</span><br><span class="tag">&lt;/div&gt;</span>' },
                    { _id: 'demo2', name: 'def hello()', category: 'PYTHON', price: 150, discountPrice: 100, discount: 33, description: 'পাইথন ফাংশন উদাহরণ', stock: 50, preview: '<span class="tag">def</span> <span class="attr">hello</span>(name):<br>    <span class="attr">print</span>(<span class="str">f"Hi {name}"</span>)' },
                    { _id: 'demo3', name: 'async fetchData()', category: 'JAVASCRIPT', price: 200, discountPrice: 150, discount: 25, description: 'অ্যাসিংক API কল', stock: 30, preview: '<span class="tag">async function</span> <span class="attr">fetchData</span>() {<br>  <span class="tag">const</span> res = <span class="tag">await</span> <span class="attr">fetch</span>(url);<br>  <span class="tag">return</span> res.<span class="attr">json</span>();<br>}' }
                ],

                get filteredProducts() {
                    return this.products.filter(p => {
                        const matchesCat = this.selectedCategory === 'ALL' || p.category === this.selectedCategory;
                        const matchesSearch = !this.searchQuery || p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || p.description.toLowerCase().includes(this.searchQuery.toLowerCase());
                        return matchesCat && matchesSearch;
                    });
                },

                get wishlistProducts() {
                    return this.products.filter(p => this.wishlist.includes(p._id));
                },

                isWishlisted(id) { return this.wishlist.includes(id); },

                toggleWishlist(product) {
                    const idx = this.wishlist.indexOf(product._id);
                    if (idx > -1) {
                        this.wishlist.splice(idx, 1);
                        this.showToastMsg('উইশলিস্ট থেকে সরানো হয়েছে', product.name);
                    } else {
                        this.wishlist.push(product._id);
                        this.showToastMsg('উইশলিস্টে যোগ করা হয়েছে', product.name);
                    }
                },

                openProduct(product) { this.selectedProduct = product; },

                async buyProduct(product) {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        this.showToastMsg('লগইন প্রয়োজন', 'প্রোডাক্ট কিনতে লগইন করুন');
                        setTimeout(() => window.location.href = '/account', 1500);
                        return;
                    }
                    try {
                        const res = await fetch('/api/shop/buy/' + product._id, {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'কেনা ব্যর্থ');
                        this.showToastMsg('সফল! 🎉', 'প্রোডাক্ট কিনা হয়েছে');
                        this.selectedProduct = null;
                    } catch (err) {
                        this.showToastMsg('ব্যর্থ', err.message);
                    }
                },

                async submitDeposit() {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        this.showToastMsg('লগইন প্রয়োজন', 'ডিপোজিট করতে লগইন করুন');
                        setTimeout(() => window.location.href = '/account', 1500);
                        return;
                    }
                    if (!this.depositForm.amount || !this.depositForm.senderNumber || !this.depositForm.transactionId) {
                        return this.showToastMsg('তথ্য অসম্পূর্ণ', 'সব ফিল্ড পূরণ করুন');
                    }
                    this.depositing = true;
                    try {
                        const res = await fetch('/api/shop/deposit', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token
                            },
                            body: JSON.stringify(this.depositForm)
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'ডিপোজিট ব্যর্থ');
                        this.showToastMsg('রিকোয়েস্ট পাঠানো হয়েছে! ⏳', 'অ্যাডমিন approve করলে ব্যালেন্স যোগ হবে');
                        this.depositForm = { amount: '', senderNumber: '', transactionId: '', method: 'bKash' };
                        this.view = 'home';
                    } catch (err) {
                        this.showToastMsg('ব্যর্থ', err.message);
                    } finally {
                        this.depositing = false;
                    }
                },

                showToastMsg(msg, sub) {
                    this.toastMessage = msg;
                    this.toastSubtext = sub;
                    this.showToast = true;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
