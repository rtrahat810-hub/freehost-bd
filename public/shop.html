<!DOCTYPE html>
<html lang="bn" x-data="shopApp()" x-init="init()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeHost BD Shop — Premium Code Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Roboto', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        body { 
            background: #f5f5f5;
            color: #212121;
        }

        .daraz-orange { background: #f85606; }
        .daraz-orange-text { color: #f85606; }
        .daraz-orange-hover:hover { background: #e04e05; }

        .product-card {
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .product-card:hover {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
            border-color: #e0e0e0;
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }
        .product-img {
            transition: transform 0.4s ease;
        }

        .cat-item {
            padding: 8px 12px;
            font-size: 12px;
            color: #424242;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            border-radius: 4px;
        }
        .cat-item:hover {
            background: #fff3ed;
            color: #f85606;
        }
        .cat-item.active {
            background: #fff3ed;
            color: #f85606;
            font-weight: 700;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f5f5f5; }
        ::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9e9e9e; }

        .skeleton {
            background: linear-gradient(90deg, #f5f5f5 25%, #e0e0e0 50%, #f5f5f5 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .stars { color: #ffb300; }

        .banner-gradient {
            background: linear-gradient(135deg, #f85606 0%, #ff8a3d 50%, #ffb366 100%);
            position: relative;
            overflow: hidden;
        }
        .banner-gradient::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .flash-timer {
            background: linear-gradient(135deg, #ff6b00, #f85606);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-up { animation: slideUp 0.3s ease; }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- ============ TOP BAR ============ -->
    <div class="bg-[#2e2e2e] text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-8 text-[11px]">
                <div class="flex items-center gap-4">
                    <a href="#" class="hover:text-orange-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-phone text-[9px]"></i> হটলাইন
                    </a>
                    <a href="#" class="hover:text-orange-400 hidden sm:flex items-center gap-1.5">
                        <i class="fa-solid fa-truck text-[9px]"></i> অর্ডার ট্র্যাক
                    </a>
                    <a href="#" class="hover:text-orange-400 hidden md:flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-question text-[9px]"></i> হেল্প
                    </a>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/account" class="hover:text-orange-400">একাউন্ট</a>
                    <a href="/account" class="hover:text-orange-400">রেজিস্ট্রেশন</a>
                    <span class="text-gray-500">|</span>
                    <button class="hover:text-orange-400 font-bold">বাংলা</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MAIN HEADER ============ -->
    <header class="bg-[#f85606] sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center gap-4 h-16">
                <!-- Logo -->
                <a href="/" class="flex items-center gap-2 flex-shrink-0">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-store text-[#f85606] text-xl"></i>
                    </div>
                    <div class="leading-none">
                        <span class="text-lg sm:text-xl font-black text-white block">FreeHost<span class="text-yellow-300"> BD</span></span>
                        <span class="text-[9px] text-white/80 font-medium tracking-wider">CODE SHOP</span>
                    </div>
                </a>

                <!-- Search Bar -->
                <div class="hidden md:flex flex-1 relative">
                    <input type="text" x-model="searchQuery" placeholder="কোড, ল্যাঙ্গুয়েজ বা ফ্রেমওয়ার্ক খুঁজুন..." 
                           class="w-full bg-white rounded-md py-2.5 pl-4 pr-12 text-sm text-gray-800 placeholder-gray-400 outline-none focus:ring-2 focus:ring-yellow-300">
                    <button class="absolute right-0 top-0 bottom-0 bg-[#2e2e2e] hover:bg-[#1a1a1a] rounded-r-md px-5 flex items-center justify-center transition">
                        <i class="fa-solid fa-magnifying-glass text-white text-sm"></i>
                    </button>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-2 flex-shrink-0 ml-auto">
                    <!-- ============ BALANCE (Wishlist ও Cart এর জায়গায়) ============ -->
                    <template x-if="user">
                        <a href="/account" class="flex items-center gap-2 bg-white/15 backdrop-blur border border-white/30 px-3 sm:px-4 py-2 rounded-md hover:bg-white/25 transition group">
                            <i class="fa-solid fa-wallet text-white text-base"></i>
                            <div class="leading-none">
                                <p class="text-[9px] text-white/80 font-medium">ব্যালেন্স</p>
                                <p class="text-sm sm:text-base font-black text-white">৳<span x-text="user.balance || 0"></span></p>
                            </div>
                        </a>
                    </template>

                    <template x-if="!user">
                        <a href="/account" class="flex items-center gap-2 bg-white/15 backdrop-blur border border-white/30 px-3 sm:px-4 py-2 rounded-md hover:bg-white/25 transition group">
                            <i class="fa-solid fa-wallet text-white text-base"></i>
                            <div class="leading-none">
                                <p class="text-[9px] text-white/80 font-medium">ব্যালেন্স</p>
                                <p class="text-sm sm:text-base font-black text-white">৳0</p>
                            </div>
                        </a>
                    </template>

                    <!-- Login/User -->
                    <template x-if="!user">
                        <a href="/account" class="bg-white text-[#f85606] px-4 py-2 rounded-md text-xs font-bold hover:bg-yellow-50 transition hidden sm:block">
                            লগইন
                        </a>
                    </template>
                    <template x-if="user">
                        <a href="/account" class="flex items-center gap-2 hover:opacity-90 transition">
                            <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-[#f85606] text-sm font-bold">
                                <span x-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'"></span>
                            </div>
                        </a>
                    </template>
                </div>
            </div>

            <!-- Mobile Search -->
            <div class="md:hidden pb-2.5 relative">
                <input type="text" x-model="searchQuery" placeholder="কোড খুঁজুন..." 
                       class="w-full bg-white rounded-md py-2 pl-3 pr-10 text-sm placeholder-gray-400 outline-none">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-[#f85606] text-sm"></i>
            </div>
        </div>
    </header>

    <!-- ============ CATEGORY NAV BAR ============ -->
    <nav class="bg-white border-b border-gray-200 sticky top-16 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center gap-1 overflow-x-auto scrollbar-none py-1">
                <button @click="selectedCategory = 'ALL'; scrollToProducts()" 
                        :class="selectedCategory === 'ALL' ? 'bg-[#fff3ed] text-[#f85606] font-bold' : 'text-gray-600 hover:text-[#f85606] hover:bg-gray-50'"
                        class="px-4 py-2.5 text-xs font-medium whitespace-nowrap rounded transition flex-shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-bars text-[10px]"></i> সব ক্যাটাগরি
                </button>
                <template x-for="cat in categories.filter(c => c.name !== 'ALL')" :key="cat.name">
                    <button @click="selectedCategory = cat.name; scrollToProducts()" 
                            :class="selectedCategory === cat.name ? 'bg-[#fff3ed] text-[#f85606] font-bold' : 'text-gray-600 hover:text-[#f85606] hover:bg-gray-50'"
                            class="px-4 py-2.5 text-xs font-medium whitespace-nowrap rounded transition flex-shrink-0">
                        <span x-text="cat.icon"></span> <span x-text="cat.name"></span>
                    </button>
                </template>
                <div class="flex-1"></div>
                <button class="px-4 py-2.5 text-xs font-bold text-[#f85606] hover:bg-[#fff3ed] rounded transition whitespace-nowrap flex-shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-fire"></i> ফ্ল্যাশ সেল
                </button>
            </div>
        </div>
    </nav>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 pb-28 md:pb-12">

        <!-- ============ HOME VIEW ============ -->
        <template x-if="view === 'home'">
            <div class="fade-in">

                <!-- ============ HERO BANNER ============ -->
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-3 mb-4">
                    <aside class="hidden lg:block bg-white rounded-md border border-gray-200">
                        <div class="px-4 py-3 border-b border-gray-100">
                            <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wider">ক্যাটাগরি</h3>
                        </div>
                        <div class="py-2">
                            <template x-for="cat in categories" :key="cat.name">
                                <div @click="selectedCategory = cat.name; scrollToProducts()" 
                                     :class="selectedCategory === cat.name ? 'active' : ''"
                                     class="cat-item">
                                    <span class="text-base" x-text="cat.icon"></span>
                                    <span x-text="cat.name === 'ALL' ? 'সব কোড' : cat.name"></span>
                                    <i class="fa-solid fa-chevron-right text-[8px] ml-auto text-gray-400"></i>
                                </div>
                            </template>
                        </div>
                    </aside>

                    <div class="lg:col-span-3">
                        <div class="banner-gradient rounded-md p-6 sm:p-10 min-h-[240px] sm:min-h-[280px] flex items-center relative overflow-hidden">
                            <div class="relative z-10 max-w-lg">
                                <div class="inline-block bg-white/20 backdrop-blur border border-white/30 px-3 py-1 rounded-full mb-3">
                                    <span class="text-white text-[11px] font-bold tracking-wider">🔥 মেগা সেল ২০২৫</span>
                                </div>
                                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black text-white leading-tight mb-3">
                                    প্রিমিয়াম কোড<br>
                                    <span class="text-yellow-300">৮০% পর্যন্ত ছাড়!</span>
                                </h1>
                                <p class="text-white/90 text-xs sm:text-sm mb-5 max-w-md">
                                    HTML, Python, JavaScript — রেডি-টু-ইউজ প্রফেশনাল কোড। একবার কিনুন, সারাজীবন ব্যবহার করুন।
                                </p>
                                <button @click="scrollToProducts()" class="bg-white text-[#f85606] px-6 py-3 rounded-md font-black text-sm hover:bg-yellow-50 transition shadow-lg flex items-center gap-2">
                                    <i class="fa-solid fa-shopping-bag"></i> এখনই কিনুন
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ============ FEATURE STRIP ============ -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                    <div class="bg-white rounded-md border border-gray-200 p-3 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-bolt text-[#f85606]"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-900">ইনস্ট্যান্ট ডেলিভারি</p>
                            <p class="text-[10px] text-gray-500">সাথে সাথেই</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-md border border-gray-200 p-3 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-shield-halved text-green-600"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-900">সিকিউর পেমেন্ট</p>
                            <p class="text-[10px] text-gray-500">১০০% নিরাপদ</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-md border border-gray-200 p-3 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-code-branch text-blue-600"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-900">সোর্স কোড সহ</p>
                            <p class="text-[10px] text-gray-500">সম্পূর্ণ ফাইল</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-md border border-gray-200 p-3 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-purple-50 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-headset text-purple-600"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-900">২৪/৭ সাপোর্ট</p>
                            <p class="text-[10px] text-gray-500">লাইভ চ্যাট</p>
                        </div>
                    </div>
                </div>

                <!-- ============ CATEGORIES QUICK ACCESS ============ -->
                <div class="bg-white rounded-md border border-gray-200 p-4 mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-bold text-gray-900">জনপ্রিয় ক্যাটাগরি</h3>
                        <button class="text-[11px] font-bold text-[#f85606] hover:underline">সব দেখুন →</button>
                    </div>
                    <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                        <template x-for="cat in categories.filter(c => c.name !== 'ALL')" :key="cat.name">
                            <button @click="selectedCategory = cat.name; scrollToProducts()" class="flex flex-col items-center gap-2 py-2 hover:bg-gray-50 rounded-md transition">
                                <div class="w-14 h-14 rounded-full bg-orange-50 flex items-center justify-center text-2xl">
                                    <span x-text="cat.icon"></span>
                                </div>
                                <span class="text-[10px] font-bold text-gray-700" x-text="cat.name"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- ============ FLASH SALE STRIP ============ -->
                <div class="bg-white rounded-md border border-gray-200 p-4 mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <h3 class="text-base font-bold text-[#f85606] flex items-center gap-2">
                                <i class="fa-solid fa-bolt"></i> ফ্ল্যাশ সেল
                            </h3>
                            <div class="flash-timer text-white text-[10px] font-bold px-2.5 py-1 rounded flex items-center gap-1.5">
                                <i class="fa-solid fa-clock"></i>
                                <span>শেষ হচ্ছে: ০২:৩৪:৫৬</span>
                            </div>
                        </div>
                        <button class="text-[11px] font-bold text-[#f85606] hover:underline">সব দেখুন →</button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3">
                        <template x-for="product in filteredProducts.slice(0, 6)" :key="product._id">
                            <div @click="openProduct(product)" class="cursor-pointer group">
                                <div class="aspect-square bg-gray-50 rounded-md overflow-hidden mb-2">
                                    <template x-if="product.imageUrl">
                                        <img :src="product.imageUrl" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    </template>
                                    <template x-if="!product.imageUrl">
                                        <div class="w-full h-full flex items-center justify-center">
                                            <i class="fa-solid fa-code text-3xl text-gray-300"></i>
                                        </div>
                                    </template>
                                </div>
                                <p class="text-xs font-bold text-[#f85606]">৳<span x-text="product.discountPrice || product.price"></span></p>
                                <p class="text-[10px] text-gray-600 line-clamp-2 leading-snug" x-text="product.name"></p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- ============ PRODUCTS SECTION ============ -->
                <section id="products">
                    <div class="bg-white rounded-t-md border border-gray-200 border-b-0 px-4 py-3 flex items-center justify-between">
                        <h2 class="text-base font-bold text-gray-900 flex items-center gap-2">
                            <i class="fa-solid fa-fire text-[#f85606]"></i>
                            <span x-show="selectedCategory === 'ALL'">সব কোড স্নিপেট</span>
                            <span x-show="selectedCategory !== 'ALL'" x-text="selectedCategory + ' কোড'"></span>
                            <span class="text-xs text-gray-500 font-normal">(<span x-text="filteredProducts.length"></span> টি)</span>
                        </h2>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] text-gray-500 hidden sm:inline">সাজান:</span>
                            <select x-model="sortBy" class="text-xs font-bold border border-gray-300 rounded py-1.5 px-2 outline-none focus:border-[#f85606] bg-white text-gray-700">
                                <option value="new">নতুন আগে</option>
                                <option value="low">দাম: কম → বেশি</option>
                                <option value="high">দাম: বেশি → কম</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-white rounded-b-md border border-gray-200 border-t-0 p-3 sm:p-4">
                        <template x-if="loading">
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                                <template x-for="i in 10" :key="i">
                                    <div class="border border-gray-100 rounded-md overflow-hidden">
                                        <div class="aspect-square skeleton"></div>
                                        <div class="p-2.5 space-y-2">
                                            <div class="h-3 skeleton rounded w-full"></div>
                                            <div class="h-3 skeleton rounded w-3/4"></div>
                                            <div class="h-4 skeleton rounded w-16"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template x-if="!loading">
                            <div>
                                <div x-show="filteredProducts.length > 0" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                                    <template x-for="(product, index) in filteredProducts" :key="product._id">
                                        <div @click="openProduct(product)" class="product-card border border-gray-100 rounded-md overflow-hidden group">
                                            <div class="aspect-square bg-gray-50 relative overflow-hidden">
                                                <template x-if="product.imageUrl">
                                                    <img :src="product.imageUrl" :alt="product.name" class="product-img w-full h-full object-cover">
                                                </template>
                                                <template x-if="!product.imageUrl">
                                                    <div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-orange-50 to-orange-100">
                                                        <i class="fa-solid fa-code text-4xl text-orange-300"></i>
                                                    </div>
                                                </template>

                                                <template x-if="product.discountPrice && product.discountPrice < product.price">
                                                    <span class="absolute top-0 right-0 bg-[#f85606] text-white text-[10px] font-bold px-2 py-0.5 rounded-bl-md">
                                                        -<span x-text="Math.round(((product.price - product.discountPrice) / product.price) * 100)"></span>%
                                                    </span>
                                                </template>

                                                <template x-if="index < 3">
                                                    <span class="absolute top-0 left-0 bg-green-500 text-white text-[9px] font-bold px-2 py-0.5 rounded-br-md">
                                                        NEW
                                                    </span>
                                                </template>

                                                <button @click.stop="toggleWishlist(product)" 
                                                        :class="isWishlisted(product._id) ? 'bg-[#f85606] text-white' : 'bg-white/90 text-gray-500 hover:text-[#f85606]'"
                                                        class="absolute bottom-2 right-2 w-7 h-7 rounded-full flex items-center justify-center shadow-sm transition">

    <!-- ============ ALPINE APP ============ -->
    <script>
        function shopApp() {
            return {
                view: 'home',
                searchQuery: '',
                selectedCategory: 'ALL',
                sortBy: 'new',
                wishlist: [],
                showToast: false,
                toastMessage: '',
                toastSubtext: '',
                toastType: 'success',
                selectedProduct: null,
                loading: false,
                user: null,
                products: [],

                categories: [
                    { name: 'ALL', icon: '🛍️' },
                    { name: 'HTML', icon: '🌐' },
                    { name: 'PYTHON', icon: '🐍' },
                    { name: 'JAVASCRIPT', icon: '⚡' }
                ],

                init() {
                    const savedUser = localStorage.getItem('user');
                    if (savedUser) { try { this.user = JSON.parse(savedUser); } catch(e) {} }

                    const savedWishlist = localStorage.getItem('shop_wishlist');
                    if (savedWishlist) { try { this.wishlist = JSON.parse(savedWishlist); } catch(e) {} }

                    this.loadProducts();
                },

                async loadProducts() {
                    this.loading = true;
                    try {
                        const res = await fetch('/api/shop/products');
                        const data = await res.json();
                        this.products = Array.isArray(data) ? data : [];
                    } catch (err) {
                        console.error('Load products error:', err);
                        this.products = [];
                    } finally {
                        this.loading = false;
                    }
                },

                get filteredProducts() {
                    let list = this.products.filter(p => {
                        const matchesCat = this.selectedCategory === 'ALL' || p.category === this.selectedCategory;
                        const q = this.searchQuery.toLowerCase();
                        const matchesSearch = !q ||
                            (p.name && p.name.toLowerCase().includes(q)) ||
                            (p.description && p.description.toLowerCase().includes(q)) ||
                            (p.productId && p.productId.toLowerCase().includes(q));
                        return matchesCat && matchesSearch;
                    });

                    if (this.sortBy === 'low') {
                        list.sort((a, b) => (a.discountPrice || a.price) - (b.discountPrice || b.price));
                    } else if (this.sortBy === 'high') {
                        list.sort((a, b) => (b.discountPrice || b.price) - (a.discountPrice || a.price));
                    } else {
                        list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    }
                    return list;
                },

                get wishlistProducts() {
                    return this.products.filter(p => this.wishlist.includes(p._id));
                },

                isWishlisted(id) { return this.wishlist.includes(id); },

                toggleWishlist(product) {
                    const idx = this.wishlist.indexOf(product._id);
                    if (idx > -1) {
                        this.wishlist.splice(idx, 1);
                        this.showToastMsg('উইশলিস্ট থেকে সরানো', product.name);
                    } else {
                        this.wishlist.push(product._id);
                        this.showToastMsg('উইশলিস্টে যোগ করা হয়েছে', product.name);
                    }
                    localStorage.setItem('shop_wishlist', JSON.stringify(this.wishlist));
                },

                openProduct(product) { this.selectedProduct = product; },

                scrollToProducts() {
                    const el = document.getElementById('products');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                },

                async buyProduct(product) {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        this.showToastMsg('লগইন প্রয়োজন', 'প্রোডাক্ট কিনতে লগইন করুন', 'error');
                        setTimeout(() => window.location.href = '/account', 1500);
                        return;
                    }
                    if (!confirm('আপনি কি ৳' + (product.discountPrice || product.price) + ' দিয়ে কিনতে চান?')) return;

                    try {
                        const res = await fetch('/api/shop/buy/' + product._id, {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'কেনা ব্যর্থ');

                        if (this.user) {
                            this.user.balance = (this.user.balance || 0) - (product.discountPrice || product.price);
                            localStorage.setItem('user', JSON.stringify(this.user));
                        }

                        this.selectedProduct = null;
                        this.showToastMsg('সফল! 🎉', 'প্রোডাক্ট কিনা হয়েছে');
                        this.loadProducts();
                    } catch (err) {
                        this.showToastMsg('ব্যর্থ', err.message, 'error');
                    }
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg;
                    this.toastSubtext = sub;
                    this.toastType = type;
                    this.showToast = true;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
