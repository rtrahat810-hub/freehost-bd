<!DOCTYPE html>
<html lang="en" x-data="photoApp()" x-init="init()" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Host — FreeHost BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Inter', 'Hind Siliguri', sans-serif; }
        [x-cloak] { display: none !important; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        body {
            background: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, #1e0a3a 0%, #030712 75%);
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.55;
            mix-blend-mode: screen;
        }
        .orb-1 { width: 650px; height: 650px; background: linear-gradient(135deg, #a855f7, #ec4899); top: -180px; left: -120px; animation: float1 20s ease-in-out infinite; }
        .orb-2 { width: 750px; height: 750px; background: linear-gradient(135deg, #ec4899, #f43f5e); top: 25%; right: -280px; animation: float2 24s ease-in-out infinite; }
        .orb-3 { width: 550px; height: 550px; background: linear-gradient(135deg, #8b5cf6, #6366f1); bottom: -180px; left: 15%; animation: float3 22s ease-in-out infinite; }

        @keyframes float1 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(100px, -80px, 60px) scale(1.2); } }
        @keyframes float2 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-130px, 100px, -70px) scale(1.15); } }
        @keyframes float3 { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(90px, -100px, 50px) scale(1.25); } }

        .glass-3d {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .text-gradient-2 {
            background: linear-gradient(135deg, #e879f9 0%, #f472b6 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-3d {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f43f5e 100%);
            background-size: 200% auto;
            color: white;
            box-shadow: 0 12px 35px -10px rgba(168, 85, 247, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-3d:hover {
            background-position: right center;
            box-shadow: 0 18px 45px -5px rgba(236, 72, 153, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateY(-3px) scale(1.02);
        }

        .pulse-glow { animation: pulse-glow-anim 2s infinite; }
        @keyframes pulse-glow-anim {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.9); }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease; }

        @keyframes float-y { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(1deg); } }
        .float-anim { animation: float-y 7s ease-in-out infinite; }

        .nav-pill.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            border-color: rgba(236, 72, 153, 0.5);
            color: white;
        }
    </style>
</head>
<body class="relative">

    <div class="bg-canvas">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- NAVBAR -->
    <nav class="relative z-30 sticky top-0">
        <div class="glass-3d border-x-0 border-t-0 rounded-none px-5 lg:px-10">
            <div class="max-w-[1400px] mx-auto">
                <div class="flex items-center justify-between h-20">
                    <a href="/" class="flex items-center gap-3.5 group">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 via-pink-600 to-rose-500 flex items-center justify-center shadow-xl shadow-purple-500/50">
                            <i class="fa-solid fa-image text-white text-lg"></i>
                        </div>
                        <div class="hidden sm:block">
                            <div class="text-xl font-black text-white">Photo<span class="text-gradient-2">Host</span></div>
                            <div class="text-[9px] text-purple-300 mono tracking-widest uppercase">Direct Image URL</div>
                        </div>
                    </a>

                    <div class="flex items-center gap-2">
                        <a href="/" class="nav-pill px-4 py-2.5 rounded-xl text-xs font-bold text-white/60 hover:text-white hover:bg-white/5 flex items-center gap-2 border border-transparent">
                            <i class="fa-brands fa-html5 text-cyan-400"></i> <span class="hidden sm:inline">HTML</span>
                        </a>
                        <a href="/shop" class="nav-pill px-4 py-2.5 rounded-xl text-xs font-bold text-white/60 hover:text-white hover:bg-white/5 flex items-center gap-2 border border-transparent">
                            <i class="fa-solid fa-store text-orange-400"></i> <span class="hidden sm:inline">Shop</span>
                        </a>
                        <a href="/account" class="nav-pill px-4 py-2.5 rounded-xl text-xs font-bold text-white/60 hover:text-white hover:bg-white/5 flex items-center gap-2 border border-transparent">
                            <i class="fa-solid fa-user text-emerald-400"></i> <span class="hidden sm:inline">Account</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-[1400px] mx-auto px-5 lg:px-10">
        <div class="py-12 lg:py-16">
            
            <div class="text-center max-w-3xl mx-auto mb-12 lg:mb-16 float-anim">
                <div class="inline-flex items-center gap-2 glass-3d px-4 py-2 rounded-full mb-6 text-xs">
                    <span class="w-2 h-2 bg-purple-400 rounded-full pulse-glow"></span>
                    <span class="text-purple-200 font-semibold mono">DIRECT IMAGE URL</span>
                </div>
                <h1 class="text-5xl lg:text-7xl font-black tracking-tight leading-[1.08] mb-6 text-white drop-shadow-lg">
                    Upload image.<br>
                    <span class="text-gradient-2">Get direct link.</span>
                </h1>
                <p class="text-gray-400 text-base max-w-xl mx-auto">
                    Upload your photo and get a live link that will run your photo in any browser.
                </p>
            </div>

            <div class="max-w-3xl mx-auto">
                <div class="glass-3d p-8 lg:p-12 rounded-3xl shadow-2xl">
                    
                    <div class="flex items-center justify-between mb-10 pb-6 border-b border-white/10">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-600 flex items-center justify-center shadow-lg shadow-purple-500/40">
                                <i class="fa-solid fa-cloud-arrow-up text-white text-xl"></i>
                            </div>
                            <div>
                                <h2 class="font-extrabold text-xl text-white">Cloud Image Uploader</h2>
                                <p class="text-xs text-gray-400">Supports JPG, PNG, GIF, WEBP up to 5MB</p>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div @dragover.prevent="isDragging = true" 
                             @dragleave.prevent="isDragging = false"
                             @drop.prevent="handleDrop($event)"
                             @click="$refs.photoInput.click()"
                             :class="isDragging ? 'border-purple-400 bg-purple-500/20 scale-[1.01]' : 'border-white/15 hover:border-purple-400/60 hover:bg-white/5'"
                             class="rounded-3xl border-2 border-dashed p-12 lg:p-20 text-center cursor-pointer transition-all duration-300 shadow-inner">
                            
                            <template x-if="!photoPreview">
                                <div>
                                    <div class="relative inline-block mb-6">
                                        <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-purple-500/20 to-pink-500/20 border border-purple-500/40 flex items-center justify-center float-anim shadow-2xl">
                                            <i class="fa-solid fa-cloud-arrow-up text-purple-400 text-4xl"></i>
                                        </div>
                                    </div>
                                    <h3 class="font-bold text-xl mb-2 text-white">Drag & Drop Image Here</h3>
                                    <p class="text-sm text-gray-400 mb-6">or click to browse local files</p>
                                    
                                    <div class="flex items-center justify-center gap-2.5 flex-wrap">
                                        <span class="text-xs mono text-gray-300 glass-3d px-3.5 py-1.5 rounded-xl font-bold">JPG</span>
                                        <span class="text-xs mono text-gray-300 glass-3d px-3.5 py-1.5 rounded-xl font-bold">PNG</span>
                                        <span class="text-xs mono text-gray-300 glass-3d px-3.5 py-1.5 rounded-xl font-bold">WEBP</span>
                                    </div>
                                </div>
                            </template>

                            <template x-if="photoPreview">
                                <div class="relative animate-[fadeIn_0.3s_ease]">
                                    <img :src="photoPreview" class="max-h-80 lg:max-h-96 mx-auto rounded-2xl shadow-2xl border border-white/20">
                                    <button @click.stop="photoPreview = null; photoFile = null; photoError = ''" 
                                            class="absolute -top-3 -right-3 bg-red-500 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-xl hover:bg-red-600 transition border-2 border-black">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                    <div class="mt-5 flex items-center justify-center gap-2 text-xs text-emerald-400 mono font-bold">
                                        <span class="w-2 h-2 bg-emerald-400 rounded-full pulse-glow"></span>
                                        IMAGE LOADED & READY
                                    </div>
                                </div>
                            </template>
                            
                            <input type="file" x-ref="photoInput" @change="handleFileSelect($event)" accept="image/*" class="hidden">
                        </div>

                        <template x-if="photoError">
                            <div class="bg-red-500/20 border border-red-500/35 rounded-2xl p-4 flex gap-3 items-center">
                                <i class="fa-solid fa-circle-exclamation text-red-400 text-lg"></i>
                                <div>
                                    <p class="text-sm font-bold text-red-300">Upload Error</p>
                                    <p class="text-xs text-red-200/80" x-text="photoError"></p>
                                </div>
                            </div>
                        </template>

                        <button @click="deployPhoto()" 
                                :disabled="!photoFile || deploying"
                                class="w-full disabled:opacity-40 disabled:cursor-not-allowed text-white font-black py-5 rounded-2xl text-base transition flex items-center justify-center gap-3 shadow-2xl"
                                :class="photoFile && !deploying ? 'btn-3d' : 'glass-3d border border-white/10'">
                            <template x-if="!deploying">
                                <span class="flex items-center gap-3">
                                    <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                                    <span>Upload & Generate Link</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </template>
                            <template x-if="deploying">
                                <span class="flex items-center gap-3">
                                    <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
                                    <span>Uploading...</span>
                                </span>
                            </template>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Success Card -->
            <template x-if="lastUploaded">
                <div class="max-w-3xl mx-auto mt-8 animate-[fadeIn_0.5s_ease]">
                    <div class="glass-3d p-8 lg:p-10 rounded-3xl border-purple-500/40 bg-gradient-to-br from-purple-500/10 via-transparent to-pink-500/10 shadow-2xl">
                        <div class="flex items-center gap-5 mb-6">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center shadow-xl shadow-purple-500/40">
                                <i class="fa-solid fa-check text-white text-2xl"></i>
                            </div>
                            <div>
                                <h3 class="font-black text-2xl text-white">Upload Successful! 🎉</h3>
                                <p class="text-sm text-gray-300 mt-1">Your direct image link is live</p>
                            </div>
                        </div>

                        <div class="grid lg:grid-cols-3 gap-6 mb-6">
                            <div class="lg:col-span-1">
                                <img :src="lastUploaded.url" class="w-full aspect-square object-cover rounded-2xl border border-white/20 shadow-xl">
                            </div>
                            <div class="lg:col-span-2 space-y-4 flex flex-col justify-between">
                                <div class="bg-black/70 border border-white/10 rounded-2xl p-4 shadow-inner">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-[10px] mono text-purple-300 font-bold tracking-wider">DIRECT URL</span>
                                        <i class="fa-solid fa-link text-purple-400 text-xs"></i>
                                    </div>
                                    <p class="text-xs mono text-purple-200 break-all font-semibold" x-text="lastUploaded.url"></p>
                                </div>
                                <div class="flex gap-3">
                                    <button @click="copyLink(lastUploaded.url)" class="flex-1 btn-3d text-white py-3.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg">
                                        <i class="fa-regular fa-copy"></i> Copy Link
                                    </button>
                                    <a :href="lastUploaded.url" target="_blank" class="flex-1 bg-white text-black py-3.5 rounded-xl text-xs font-bold hover:bg-gray-100 transition flex items-center justify-center gap-2 shadow-lg">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Image
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- TOAST -->
    <div x-show="showToast" x-cloak
         x-transition:enter="transform transition ease-out duration-300"
         x-transition:enter-start="translate-y-20 opacity-0"
         x-transition:enter-end="translate-y-0 opacity-100"
         class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 max-w-sm w-full px-4">
        <div class="glass-3d p-5 rounded-3xl shadow-2xl flex items-center gap-4 bg-gray-900/90 border border-white/20">
            <div :class="toastType === 'error' ? 'bg-red-500/20 border-red-500/40 text-red-400' : 'bg-emerald-500/20 border-emerald-500/40 text-emerald-400'" 
                 class="w-12 h-12 rounded-2xl border flex items-center justify-center flex-shrink-0">
                <i :class="toastType === 'error' ? 'fa-solid fa-xmark text-lg' : 'fa-solid fa-check text-lg'"></i>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-white" x-text="toastMessage"></p>
                <p class="text-xs text-gray-400 truncate mono mt-0.5" x-text="toastSubtext"></p>
            </div>
        </div>
    </div>

    <script>
        function photoApp() {
            return {
                deploying: false,
                isDragging: false,
                showToast: false,
                toastMessage: '',
                toastSubtext: '',
                toastType: 'success',
                photoFile: null,
                photoPreview: null,
                photoError: '',
                lastUploaded: null,

                init() {
                    // Any init code
                },

                handleFileSelect(e) {
                    const file = e.target.files[0];
                    if (file) this.processPhoto(file);
                },

                handleDrop(e) {
                    this.isDragging = false;
                    const file = e.dataTransfer.files[0];
                    if (file) this.processPhoto(file);
                },

                processPhoto(file) {
                    this.photoError = '';
                    if (!file.type.startsWith('image/')) {
                        this.photoError = 'Only image files (JPG, PNG, WEBP) are supported!';
                        this.photoFile = null; this.photoPreview = null;
                        return;
                    }
                    if (file.size > 5 * 1024 * 1024) {
                        this.photoError = 'File size exceeds 5MB limit.';
                        this.photoFile = null; this.photoPreview = null;
                        return;
                    }
                    this.photoFile = file;
                    const reader = new FileReader();
                    reader.onload = (ev) => { this.photoPreview = ev.target.result; };
                    reader.readAsDataURL(file);
                },

                async deployPhoto() {
                    if (!this.photoFile) return this.showToastMsg('No Image', 'Please select an image', 'error');
                    this.deploying = true;
                    try {
                        const formData = new FormData();
                        formData.append('photo', this.photoFile);
                        const token = localStorage.getItem('token');
                        
                        const res = await fetch('/api/photo', {
                            method: 'POST',
                            headers: { 'Authorization': token ? 'Bearer ' + token : '' },
                            body: formData
                        });
                        
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'Upload failed');

                        this.lastUploaded = {
                            url: data.photo.url,
                            filename: data.photo.filename
                        };
                        this.photoFile = null; this.photoPreview = null;
                        this.showToastMsg('Image Uploaded! 🎉', data.photo.url, 'success');
                    } catch (err) {
                        this.showToastMsg('Upload Failed', err.message, 'error');
                    } finally {
                        this.deploying = false;
                    }
                },

                copyLink(url) {
                    navigator.clipboard.writeText(url).then(() => {
                        this.showToastMsg('Link Copied!', url, 'success');
                    }).catch(() => {
                        this.showToastMsg('Copy Failed', 'Please copy manually', 'error');
                    });
                },

                showToastMsg(msg, sub, type = 'success') {
                    this.toastMessage = msg;
                    this.toastSubtext = sub;
                    this.toastType = type;
                    this.showToast = true;
                    clearTimeout(this._t);
                    this._t = setTimeout(() => { this.showToast = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
